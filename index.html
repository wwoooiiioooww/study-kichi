<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#8EC8F2">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="スタディきち">
<title>スタディきち｜そら＆ふう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky-bg:#EAF4FC; --sky-deep:#CDE5F7;
  --ink:#2B3A55; --ink-soft:#6B7C99;
  --blue:#3E8FD8; --blue-d:#2F6FB0;
  --orange:#FF8A5C; --orange-d:#F0703F;
  --gold:#FFC53D; --green:#58C08A;
  --card:#FFFFFF; --line:#D8E6F2;
  --danger:#E86A6A;
  --r:20px;
  --disp:'M PLUS Rounded 1c',sans-serif;
  --body:'Zen Kaku Gothic New',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--body);color:var(--ink);
  background:linear-gradient(180deg,#BBDDF5 0%,#EAF4FC 40%);
  background-attachment:fixed;
}
#shell{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--sky-bg);
  box-shadow:0 0 40px rgba(62,143,216,.15);position:relative;padding-bottom:84px}
/* ---------- sky header ---------- */
.sky{position:relative;overflow:hidden;padding:18px 18px 22px;
  background:linear-gradient(180deg,#8EC8F2 0%,#B9DFF8 70%,var(--sky-bg) 100%);
  border-radius:0 0 28px 28px}
.cloud{position:absolute;background:#fff;border-radius:50px;opacity:.85;filter:blur(1px)}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.c1{width:90px;height:26px;top:16px;left:-100px;animation:drift 46s linear infinite}
.c1::before{width:38px;height:38px;top:-18px;left:14px}
.c1::after{width:26px;height:26px;top:-12px;left:46px}
.c2{width:64px;height:20px;top:58px;left:-80px;animation:drift 68s linear 8s infinite;opacity:.6}
.c2::before{width:28px;height:28px;top:-13px;left:10px}
.c2::after{width:18px;height:18px;top:-8px;left:34px}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(620px)}}
@media (prefers-reduced-motion:reduce){.cloud{animation:none;left:20%}.c2{left:60%}}
.sky h1{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:.02em;position:relative}
.sky .sub{font-size:12px;color:#2F6FB0;margin-top:2px;position:relative}
.profile-row{display:flex;gap:10px;margin-top:14px;position:relative}
.pf{flex:1;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.75);
  border:2px solid transparent;border-radius:16px;padding:8px 10px;cursor:pointer;
  font-family:var(--disp);font-weight:700;font-size:14px;transition:.15s}
.pf.on{border-color:var(--blue);background:#fff;box-shadow:0 4px 12px rgba(62,143,216,.25)}
.pf .em{font-size:22px}
.pf .g{font-size:10px;color:var(--ink-soft);font-weight:500}
/* ---------- common ---------- */
main{padding:16px 16px 8px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;
  box-shadow:0 2px 10px rgba(43,58,85,.06)}
h2{font-family:var(--disp);font-weight:800;font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.muted{color:var(--ink-soft);font-size:12px}
.btn{display:block;width:100%;border:none;border-radius:16px;padding:14px;cursor:pointer;
  font-family:var(--disp);font-weight:800;font-size:16px;color:#fff;
  background:linear-gradient(180deg,var(--orange),var(--orange-d));
  box-shadow:0 4px 0 #D65E30;transition:.1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #D65E30}
.btn.blue{background:linear-gradient(180deg,var(--blue),var(--blue-d));box-shadow:0 4px 0 #245A92}
.btn.blue:active{box-shadow:0 1px 0 #245A92}
.btn.ghost{background:#fff;color:var(--blue-d);border:2px solid var(--line);box-shadow:none;font-weight:700}
.btn.sm{padding:9px;font-size:13px;border-radius:12px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px}
.row>*{flex:1}
input,textarea,select{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px;
  font-family:var(--body);font-size:14px;background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--blue);border-color:var(--blue)}
label{font-size:12px;font-weight:700;color:var(--ink-soft);display:block;margin:10px 0 4px}
/* ---------- home ---------- */
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:#fff;border-radius:16px;padding:10px;text-align:center;box-shadow:0 2px 8px rgba(43,58,85,.05)}
.stat .n{font-family:var(--disp);font-weight:800;font-size:20px;color:var(--blue-d)}
.stat .l{font-size:10px;color:var(--ink-soft);font-weight:700}
.bases{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.base{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 10px;text-align:center;cursor:pointer;transition:.12s}
.base:active{transform:scale(.96)}
.base .em{font-size:30px}
.base .nm{font-family:var(--disp);font-weight:700;font-size:13px;margin-top:4px}
.base .cnt{font-size:10px;color:var(--ink-soft);margin-top:2px}
.base .ttl{display:inline-block;font-size:10px;font-weight:700;color:#B07800;background:#FFF3D1;border-radius:8px;padding:1px 7px;margin-top:4px}
/* ---------- timer ---------- */
.timer-wrap{text-align:center;padding:26px 0 10px}
.timer-base{font-family:var(--disp);font-weight:700;color:var(--blue-d);font-size:14px}
.timer-num{font-family:var(--disp);font-weight:800;font-size:64px;letter-spacing:.02em;margin:6px 0}
.timer-num.over{color:var(--green)}
.cheer{min-height:20px;font-size:13px;color:var(--ink-soft)}
.ring{width:190px;height:190px;margin:10px auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;
  font-family:var(--disp);font-weight:700;font-size:13px;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
/* ---------- slot ---------- */
.slot-box{background:linear-gradient(180deg,#2B3A55,#1D2A42);border-radius:24px;padding:22px 16px;text-align:center;color:#fff}
.slot-title{font-family:var(--disp);font-weight:800;font-size:16px;color:var(--gold)}
.reels{display:flex;justify-content:center;gap:10px;margin:16px 0}
.reel{width:76px;height:86px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:44px;box-shadow:inset 0 -6px 0 #E4EDF6}
.reel.spin{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:translateY(-3px)}50%{transform:translateY(3px)}100%{transform:translateY(-3px)}}
.slot-result{font-family:var(--disp);font-weight:800;font-size:17px;min-height:26px;color:var(--gold)}
/* ---------- grass ---------- */
.grass{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;overflow-x:auto;padding-bottom:4px}
.g0{background:#E4EDF6}.g1{background:#BCE3CB}.g2{background:#7FD0A0}.g3{background:#43A96F}
.grass i{border-radius:3px;display:block}
.streak-flame{font-size:26px}
/* ---------- session list ---------- */
.sess{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.sess:last-child{border-bottom:none}
.sess .em{font-size:22px}
.sess .info{flex:1;font-size:12px}
.sess .info b{font-family:var(--disp);font-size:13px}
.badge{font-size:10px;font-weight:700;border-radius:8px;padding:2px 8px}
.b-pend{background:#FFF3D1;color:#B07800}
.b-ok{background:#DDF3E6;color:#2C7A4E}
.b-ng{background:#FBE1E1;color:#B04040}
.thumb{width:42px;height:42px;object-fit:cover;border-radius:10px;cursor:pointer;border:2px solid var(--line)}
/* ---------- goals ---------- */
.goal-card{background:linear-gradient(135deg,#FFF6E3,#FFEAC2);border:2px solid #FFD98A;border-radius:var(--r);padding:14px;margin-bottom:12px}
.goal-card .rw{font-family:var(--disp);font-weight:800;font-size:15px;color:#9A6B00}
.goal-card .tt{font-size:12px;color:#B07800;font-weight:700}
.chart-wrap{overflow-x:auto}
/* ---------- chat ---------- */
.chat-log{display:flex;flex-direction:column;gap:10px;min-height:200px;max-height:52vh;overflow-y:auto;padding:4px 0}
.msg{max-width:82%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:#fff;border:2px solid var(--line);border-bottom-left-radius:4px}
.msg.ai .who{font-size:10px;font-weight:700;color:var(--blue-d);margin-bottom:2px}
.chat-input{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chat-input textarea{flex:1 1 100%;resize:none;height:96px;font-size:16px}
.chat-input .send-btn{flex:1;min-height:46px;border:none;border-radius:14px;background:var(--blue);color:#fff;font-family:var(--disp);font-weight:800;font-size:15px;cursor:pointer}
.typing{font-size:12px;color:var(--ink-soft)}
.day-sep{display:flex;align-items:center;gap:8px;margin:2px 0}
.day-sep::before,.day-sep::after{content:"";flex:1;height:1px;background:var(--line)}
.day-sep span{font-size:10px;color:var(--ink-soft);font-weight:700}
/* ---------- メモボード ---------- */
.bd-tools{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.bd-pen{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.bd-tl{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:16px;cursor:pointer}
.bd-pen.on,.bd-tl.on{box-shadow:0 0 0 3px var(--blue)}
#board{width:100%;background:#fff;border:2px solid var(--line);border-radius:14px;touch-action:none;display:block}
/* ---------- nav ---------- */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:#fff;border-top:1px solid var(--line);display:flex;z-index:50;
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:none;background:none;padding:9px 0 7px;cursor:pointer;color:var(--ink-soft);
  font-family:var(--disp);font-weight:700;font-size:10px}
nav button .i{display:block;font-size:20px;margin-bottom:1px}
nav button.on{color:var(--blue-d)}
/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(30,42,66,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:20px 18px 26px;max-height:88dvh;overflow-y:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.modal{animation:none}}
.modal h3{font-family:var(--disp);font-weight:800;font-size:16px;margin-bottom:12px}
.close-x{float:right;border:none;background:#EEF4FA;border-radius:50%;width:30px;height:30px;font-size:14px;cursor:pointer;color:var(--ink-soft)}
.photo-view{max-width:100%;border-radius:14px}
/* confetti */
.confetti{position:fixed;top:-10px;font-size:18px;z-index:200;animation:fall 2.4s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.7}}
.ticket-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ticket-item button{border:none;background:#FBE1E1;color:#B04040;border-radius:8px;padding:4px 10px;font-size:11px;cursor:pointer}
.won-ticket{background:linear-gradient(90deg,#FFF6E3,#FFEFD0);border:2px dashed var(--gold);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.won-ticket button{border:none;background:var(--green);color:#fff;border-radius:10px;padding:6px 12px;font-family:var(--disp);font-weight:700;cursor:pointer;font-size:12px}
/* ---------- chat photo / quick ---------- */
.chat-quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qchip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-family:var(--disp);font-weight:700;font-size:12px;color:var(--blue-d);cursor:pointer}
.qchip:active{transform:scale(.96)}
.attach-btn{flex:0 0 auto;width:46px;min-height:46px;border:2px solid var(--line);background:#fff;border-radius:14px;font-size:20px;cursor:pointer}
.attach-btn:active{background:#EEF4FA}
.attach-btn.rec{background:#FBE1E1;border-color:var(--danger);animation:pulse 1s ease infinite}
@keyframes pulse{50%{opacity:.6}}
.chat-photo{display:block;max-width:180px;border-radius:12px;margin-bottom:6px}
.photo-chip{display:flex;align-items:center;gap:8px;background:#EEF4FA;border:2px solid var(--line);border-radius:12px;padding:6px 8px;margin-top:8px;font-size:12px;font-weight:700;color:var(--ink-soft)}
.photo-chip img{width:44px;height:44px;object-fit:cover;border-radius:8px}
.photo-chip button{margin-left:auto;border:none;background:#FBE1E1;color:#B04040;border-radius:8px;width:26px;height:26px;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<div id="shell">
  <header class="sky">
    <div class="cloud c1"></div><div class="cloud c2"></div>
    <h1 id="hd-title">スタディきち ☁️</h1>
    <div class="sub" id="hd-sub"></div>
    <div class="profile-row" id="profile-row"></div>
  </header>
  <main id="app"></main>
  <nav id="nav"></nav>
</div>
<div id="modal-root"></div>
<script>
/* ============================================================
   スタディきち — 空花＆風花のための自習出撃アプリ
   データはこの端末の中だけに保存されます（localStorage / IndexedDB）
   ============================================================ */
/* ---------- マスタ ---------- */
const DEFAULT_BASES=[
 {id:'solid',name:'ソリッドスクエア',em:'🏢'},
 {id:'mcd',name:'マクドナルド',em:'🍟'},
 {id:'light',name:'ライトハウス自習室',em:'📚'},
 {id:'gakudo',name:'学童',em:'🎒'},
 {id:'home',name:'おうち机',em:'🏠'},
];
const TITLES=[[40,'ぬし'],[20,'たつじん'],[10,'じょうれん'],[3,'かよいはじめ']];
const SUBJECTS=['算数','国語','理科','社会','英語','その他'];
/* AI相棒へのワンタップ質問 */
const QUICKS=[
 {id:'hint',label:'💡ヒントちょうだい',text:'この問題のヒントを、答えは言わずにひとつだけ教えて。'},
 {id:'think',label:'🤔考え方おしえて',text:'この問題の考え方や、どこから手をつければいいかを教えて。答えはまだ言わないでね。'},
 {id:'check',label:'✅答え合わせして',text:'わたしが解いた内容が合っているか答え合わせして。まちがいがあれば、どこが惜しいか教えて。'},
 {id:'explain',label:'📖解説して',text:'この問題の解き方を、さいごまでやさしく解説して。'},
];

/* ---------- 状態 ---------- */
function mkProfile(name,em,grade){return{
 name,em,grade,points:0,sessions:[],exams:[],chat:[],chatArchive:[],
 aiName:'そらとも',
 examTarget:{label:'次の模試の目標',value:''},
 bigGoals:[
  {title:'模試で目標クリア!',reward:'すきなレストランへGO 🍽️'},
  {title:'中学ごうかく!!',reward:'スペシャル沖縄旅行 ✈️🌺'},
 ],
 pool:[{name:'小籠包ディナー券 🥟',price:800},{name:'魚だしごはんリクエスト券 🐟',price:400},{name:'パパと30分あそぶ券 🎮',price:300}],
 tickets:[],
 lastGoldenMilestone:0,
};}
const DEFAULT_STATE={
v:3, tab:'home', currentProfile:'sora', parentPin:null,
 bases:JSON.parse(JSON.stringify(DEFAULT_BASES)),
 gemini:{key:'',model:'gemini-3.5-flash'}, // ※Googleの現行モデル名。エラーになる場合は最新のモデル名に変更してください
 profiles:{ sora:mkProfile('空花','🌸','小5'), fuka:mkProfile('風花','🍃','小3') },
 activeSession:null,
};
let S=load();
function load(){
 try{const raw=localStorage.getItem('studykichi_v1');
  if(raw){const s=JSON.parse(raw);const st=Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)),s);migrate(st);return st;}
 }catch(e){}
 return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
/* v1→v3 移行:券の値札・チャットアーカイブ・編集可能な基地 */
function migrate(st){
 Object.values(st.profiles||{}).forEach(pr=>{
  if(Array.isArray(pr.pool))pr.pool=pr.pool.map(t=>typeof t==='string'?{name:t,price:500}:t);
  if(pr.lastGoldenMilestone==null)pr.lastGoldenMilestone=0;
  if(!Array.isArray(pr.chatArchive))pr.chatArchive=[];
 });
 if(!Array.isArray(st.bases)||!st.bases.length)st.bases=JSON.parse(JSON.stringify(DEFAULT_BASES));
 if(!st.currentProfile||!st.profiles[st.currentProfile])st.currentProfile=Object.keys(st.profiles)[0];
 if(st.gemini&&(!st.gemini.model||st.gemini.model==='gemini-2.5-flash'))st.gemini.model='gemini-3.5-flash';
 st.v=3;
}
function save(){
 try{localStorage.setItem('studykichi_v1',JSON.stringify(S));}
 catch(e){ // ほぼ写真での容量オーバー。各プロフィールの古い写真をはがして再試行
  try{Object.values(S.profiles).forEach(pr=>{
    const imgs=(pr.chat||[]).filter(m=>m.img);
    imgs.slice(0,Math.max(0,imgs.length-2)).forEach(m=>{m.img=null;});
    (pr.chatArchive||[]).forEach(a=>(a.msgs||[]).forEach(m=>{if(m.img)m.img=null;}));
  });
  localStorage.setItem('studykichi_v1',JSON.stringify(S));}catch(_){}}
}
function P(){return S.profiles[S.currentProfile];}

/* ---------- 写真ストレージ (IndexedDB) ---------- */
let _db=null;
function idb(){return new Promise((res,rej)=>{
 if(_db)return res(_db);
 const r=indexedDB.open('studykichi',1);
 r.onupgradeneeded=e=>{e.target.result.createObjectStore('photos');};
 r.onsuccess=e=>{_db=e.target.result;res(_db);};
 r.onerror=()=>rej(r.error);
});}
async function putPhoto(id,dataUrl){const d=await idb();return new Promise((res,rej)=>{
 const t=d.transaction('photos','readwrite');t.objectStore('photos').put(dataUrl,id);
 t.oncomplete=res;t.onerror=()=>rej(t.error);});}
async function getPhoto(id){const d=await idb();return new Promise(res=>{
 const q=d.transaction('photos').objectStore('photos').get(id);
 q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);});}

/* ---------- ユーティリティ ---------- */
const $=s=>document.querySelector(s);
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(ts){const d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate();}
function dayKey(ts){const d=new Date(ts);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function todayKey(){return dayKey(Date.now());}
function minutesByDay(p){const m={};p.sessions.forEach(s=>{
 if(s.status!=='rejected'){const k=dayKey(s.endTs||s.startTs);m[k]=(m[k]||0)+(s.minutes||0);}});return m;}
function calcStreak(p){const m=minutesByDay(p);let streak=0;const d=new Date();
 if(!m[dayKey(d.getTime())]){d.setDate(d.getDate()-1);}
 while(m[dayKey(d.getTime())]){streak++;d.setDate(d.getDate()-1);}
 return streak;}
/* --- スロット経済のルール --- */
const MILESTONES=[3,7,14,30,50,100,200];
function coefFor(min){return min<15?0.3:min<45?1:1.5;} // 時間係数
function dayTotal(p,ts){const k=dayKey(ts);let t=0;
 p.sessions.forEach(s=>{if(s.status!=='rejected'&&dayKey(s.endTs||s.startTs)===k)t+=(s.minutes||0);});
 return t;}
function spinQueue(p){return p.sessions.filter(s=>s.status==='approved'&&!s.spin);}
function goldenAvailable(p){const st=calcStreak(p);
 if(st<(p.lastGoldenMilestone||0))p.lastGoldenMilestone=0; // 連続が途切れたらリセット
 let m=0;MILESTONES.forEach(x=>{if(st>=x)m=x;});
 return (m>0&&m>(p.lastGoldenMilestone||0))?m:0;}
function nextMilestone(p){const st=calcStreak(p);

  ['#2B3A55','#3E8FD8','#E86A6A'].map((c,i)=>'<button class="bd-pen'+(i===0?' on':'')+'" data-c="'+c+'" style="background:'+c+'"></button>').join('')+
  '<button class="bd-tl" id="bd-eraser">🧽</button>'+
  '<button class="bd-tl" onclick="bdUndo()">↩️</button>'+
  '<button class="bd-tl" onclick="bdClear()">🗑️</button></div>'+
 '<canvas id="board"></canvas>'+
 '<div class="row" style="margin-top:10px"><button class="btn sm" onclick="saveBoard()">💾 ほぞんする</button>'+
 '<button class="btn ghost sm" onclick="closeBoard()">とじる</button></div>'+
 '<div class="muted" style="margin-top:6px">ほぞんすると「きろく」にのこって、あとから見かえせるよ</div>',false);
 initBoard();}
function initBoard(){const cv=$('#board');
 const dpr=Math.min(2,window.devicePixelRatio||1);
 const w=cv.clientWidth||320,h=440;
 cv.width=w*dpr;cv.height=h*dpr;cv.style.height=h+'px';
 const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
 ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
 ctx.lineCap='round';ctx.lineJoin='round';
 bd={cv,ctx,w,h,color:'#2B3A55',eraser:false,drawing:false,dirty:false,undo:[]};
 cv.addEventListener('pointerdown',bdDown);
 cv.addEventListener('pointermove',bdMove);
 window.addEventListener('pointerup',bdUp);
 document.querySelectorAll('.bd-pen').forEach(b=>b.onclick=()=>{
  bd.color=b.dataset.c;bd.eraser=false;bdMark(b);});
 $('#bd-eraser').onclick=()=>{bd.eraser=true;bdMark($('#bd-eraser'));};}
function bdMark(btn){document.querySelectorAll('.bd-pen,.bd-tl').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
function bdPos(e){const r=bd.cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
function bdDown(e){e.preventDefault();
 if(bd.cv.setPointerCapture)try{bd.cv.setPointerCapture(e.pointerId);}catch(_){ }
 bdSnap();bd.drawing=true;bd.dirty=true;
 const[x,y]=bdPos(e);bd.ctx.beginPath();bd.ctx.moveTo(x,y);bdStroke(x+0.1,y+0.1);}
function bdMove(e){if(!bd.drawing)return;e.preventDefault();const[x,y]=bdPos(e);bdStroke(x,y);}
function bdStroke(x,y){const c=bd.ctx;
 c.strokeStyle=bd.eraser?'#fff':bd.color;c.lineWidth=bd.eraser?26:3;
 c.lineTo(x,y);c.stroke();}
function bdUp(){if(bd)bd.drawing=false;}
function bdSnap(){if(!bd.cv)return;bd.undo.push(bd.cv.toDataURL());if(bd.undo.length>10)bd.undo.shift();}
function bdUndo(){const d=bd.undo.pop();if(!d)return;
 const img=new Image();img.onload=()=>{bd.ctx.drawImage(img,0,0,bd.w,bd.h);};img.src=d;}
function bdClear(){bdSnap();bd.ctx.fillStyle='#fff';bd.ctx.fillRect(0,0,bd.w,bd.h);}
async function saveBoard(){if(!bd.cv)return;
 const d=bd.cv.toDataURL('image/jpeg',.7);
 const id='m'+Date.now();
 try{await putPhoto(id,d);}catch(e){alert('ほぞんできなかった…もういちど ためしてね');return;}
 if(S.activeSession){(S.activeSession.boards=S.activeSession.boards||[]).push(id);save();}
 bd.dirty=false;
 window.removeEventListener('pointerup',bdUp);
 closeModal();render();}
function closeBoard(){

 window.removeEventListener('pointerup',bdUp);
 closeModal();}

/* ---------- スロット(承認後にまとめて回せる) ----------
   確率(通常):  3% 券ジャックポット / 9% 👑+100pt / 25% ⭐+50pt / 63% 🍀+10〜30pt
   確率(ゴールデン): 8% / 20% / 35% / 37%
   ポイントには時間係数がかかる: 15分未満×0.3 / 15〜44分×1.0 / 45分以上×1.5
   券ジャックポットは「その日の合計25分以上」のセッションだけ抽選対象 */
const EMO=['🍀','⭐','🥟','🐟','🌸','🍃','👑'];
let slotQueue=[];let goldenM=0;
function openSlots(){const p=P();
 slotQueue=spinQueue(p).map(s=>s.id);
 if(!slotQueue.length)return;
 goldenM=goldenAvailable(p);
 showSlotModal();}
function showSlotModal(){const golden=goldenM>0;
 openModal('<div class="slot-box"'+(golden?' style="background:linear-gradient(180deg,#6E4E00,#2E2300);outline:3px solid var(--gold)"':'')+'>'+
 '<div class="slot-title">'+(golden?'🔥 ゴールデンスロット 🔥':'🎰 がんばりスロット 🎰')+'</div>'+
 (golden?'<div style="font-size:12px;color:#FFE9A8;margin-top:2px">れんぞく'+goldenM+'日たっせいのごほうび!大当たりしやすいよ✨</div>':'')+
 '<div class="reels"><div class="reel" id="r0">❔</div><div class="reel" id="r1">❔</div><div class="reel" id="r2">❔</div></div>'+
 '<div class="slot-result" id="slot-res"></div>'+
 '<button class="btn" id="spin-btn" style="margin-top:10px">まわす!(あと'+slotQueue.length+'回)</button></div>',false);
 $('#spin-btn').onclick=spinNext;}
function spinNext(){const p=P();const id=slotQueue[0];
 const s=p.sessions.find(x=>x.id===id);
 if(!s){closeModal();render();return;}
 const golden=goldenM>0;
 const c=coefFor(s.minutes||0);
 const btn=$('#spin-btn');btn.disabled=true;
 const reels=[$('#r0'),$('#r1'),$('#r2')];
 reels.forEach(r=>r.classList.add('spin'));
 const spinI=setInterval(()=>reels.forEach(r=>{r.textContent=EMO[Math.floor(Math.random()*EMO.length)];}),80);
 const roll=Math.random();
 const dayOk=dayTotal(p,s.endTs||s.startTs)>=25;
 const pT=golden?.08:.03, pG=golden?.20:.09, pM=golden?.35:.25;
 let res;
 if(roll<pT&&p.pool.length&&dayOk){const t=p.pool[Math.floor(Math.random()*p.pool.length)];
  res={pts:0,ticket:t.name,face:['🎟️','🎟️','🎟️'],msg:'🌈けんジャックポット!!「'+t.name+'」をタダでゲット!!',big:true};}
 else if(roll<pT+pG){res={pts:Math.max(1,Math.round(100*c)),face:['👑','👑','👑'],big:true};}
 else if(roll<pT+pG+pM){res={pts:Math.max(1,Math.round(50*c)),face:['⭐','⭐','⭐']};}
 else{const v=10+Math.floor(Math.random()*3)*10;
  res={pts:Math.max(1,Math.round(v*c)),face:['🍀','⭐','🌸'].sort(()=>Math.random()-.5)};}
 if(!res.msg)res.msg=(res.big?'✨大当たり!! ':'')+'+'+res.pts+'ポイント!'+(c!==1?'(べんきょう時間ボーナス ×'+c+')':'');
 setTimeout(()=>{clearInterval(spinI);
  reels.forEach((r,i)=>{r.classList.remove('spin');r.textContent=res.face[i];});
  $('#slot-res').textContent=res.msg;
  p.points+=res.pts;
  if(res.ticket)p.tickets.push(res.ticket);
  s.spin=(golden?'🔥':'')+res.msg;
  if(golden){p.lastGoldenMilestone=goldenM;goldenM=0;}

 '<div class="chart-wrap" style="margin-top:8px">'+examChart(p)+'</div>'+
 p.exams.slice().reverse().map(e=>'<div class="sess"><span class="em">📝</span><div class="info">'+

function nearGoal(p){const tgt=Number(p.examTarget.value);
 if(!p.exams.length||!tgt)return '';
 const last=Number(p.exams[p.exams.length-1].score)||0;const diff=tgt-last;
 return diff<=0?' → 達成中!!🎉':' → あと <b>'+diff+'</b> !';}
function examChart(p){const ex=p.exams;
 if(!ex.length)return '<div class="muted">模試のけっかを入れると グラフになるよ</div>';
 const W=Math.max(320,ex.length*64),H=170,pad=30;
 const vals=ex.map(e=>Number(e.score)||0);const tgt=Number(p.examTarget.value)||null;
 let min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);
 if(tgt!==null&&tgt>0){min=Math.min(min,tgt);max=Math.max(max,tgt);}
 if(min===max){min-=5;max+=5;}
 const padV=(max-min)*.18;min-=padV;max+=padV;
 const x=i=>pad+i*((W-pad*2)/Math.max(1,ex.length-1));
 const y=v=>H-pad-((v-min)/(max-min))*(H-pad*2);
 let svg='<svg width="'+W+'" height="'+H+'">';
 if(tgt!==null&&tgt>0){svg+='<line x1="'+pad+'" y1="'+y(tgt)+'" x2="'+(W-pad)+'" y2="'+y(tgt)+'" stroke="#FFC53D" stroke-width="2" stroke-dasharray="6 4"/>'+
  '<text x="'+(W-pad)+'" y="'+(y(tgt)-6)+'" text-anchor="end" font-size="10" fill="#B07800">目標 '+tgt+'</text>';}
 svg+='<polyline points="'+vals.map((v,i)=>x(i)+','+y(v)).join(' ')+'" fill="none" stroke="#3E8FD8" stroke-width="3" stroke-linejoin="round"/>';
 vals.forEach((v,i)=>{svg+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="5" fill="#fff" stroke="#3E8FD8" stroke-width="3"/>'+
  '<text x="'+x(i)+'" y="'+(y(v)-10)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#2B3A55">'+v+'</text>';});
 return svg+'</svg>';}

 Object.entries(S.profiles).map(([id,pr])=>'<div class="row" style="margin-top:6px">'+

  '<input data-pf-gr="'+id+'" value="'+esc(pr.grade)+'" style="flex:0 0 64px">'+
  (Object.keys(S.profiles).length>1?'<button class="btn ghost sm" style="flex:0 0 44px;color:#B04040" onclick="delProfile(\''+id+'\')">✕</button>':'')+
 '</div>').join('')+
 '<button class="btn ghost sm" style="margin-top:8px" onclick="addProfile()">＋ メンバーついか</button>'+
 '<h2 style="margin-top:16px">🗺️ きちの編集</h2>'+
 '<div class="muted">なまえをかえても出撃回数は引きつがれます。けしても、まえのきろくはのこります。</div>'+
 S.bases.map((b,i)=>'<div class="row" style="margin-top:6px">'+
  '<input data-bs-em="'+i+'" value="'+esc(b.em)+'" maxlength="4" style="flex:0 0 56px;text-align:center;font-size:20px">'+
  '<input data-bs-nm="'+i+'" value="'+esc(b.name)+'">'+
  (S.bases.length>1?'<button class="btn ghost sm" style="flex:0 0 44px;color:#B04040" onclick="delBase('+i+')">✕</button>':'')+
 '</div>').join('')+
 '<button class="btn ghost sm" style="margin-top:8px" onclick="addBase()">＋ きちついか</button>'+
 '<h2 style="margin-top:16px">🔑 Gemini APIキー</h2>'+
 '<div class="muted">キーはこの端末のブラウザ内にだけ保存され、Googleとの通信にのみ使われます。コードには書かれません。</div>'+
 '<button class="btn ghost sm" style="margin-top:6px" onclick="keyGuide()">📖 キーのかんたん取得ガイド(無料・約5分)</button>'+
 '<input id="gm-key" type="password" placeholder="AIza..." value="'+esc(S.gemini.key)+'" style="margin-top:6px">'+
 '<label>モデル</label><input id="gm-model" value="'+esc(S.gemini.model)+'">'+
 '<h2 style="margin-top:16px">🔐 暗証番号(PIN)の変更</h2>'+
 '<div class="row"><input id="pin-chg" type="password" inputmode="numeric" maxlength="4" placeholder="新しい4けたの数字">'+
 '<button class="btn blue sm" style="flex:0 0 90px" onclick="changePin()">変更</button></div>'+
 '<h2 style="margin-top:16px">💾 バックアップから復元</h2>'+
 '<input type="file" accept=".json" onchange="importData(this)">'+
 '<h2 style="margin-top:16px">🧨 初期化</h2>'+
 '<div class="muted">全メンバーのきろく・ポイント・券・会話・写真・PIN・APIキーをすべて消して、はじめての状態にもどします。</div>'+
 '<button class="btn ghost sm" style="margin-top:6px;color:#B04040" onclick="factoryReset()">初期設定にもどす</button>'+
 '<button class="btn" style="margin-top:18px" onclick="saveParent()">まとめて保存</button>');
 loadThumbs();}
function parentSessRow(s){const b=S.bases.find(x=>x.id===s.base)||{em:"📍",name:"(まえの基地)"};
 return '<div class="sess" id="ps-'+s.id+'"><span class="em">'+b.em+'</span>'+
 '<div class="info"><b>'+fmtDate(s.startTs)+' '+b.name+' '+s.minutes+'分</b><br>'+
 esc((s.subjects||[]).join('・'))+' '+esc(s.memo||'')+'</div>'+
 (s.photoId?'<img class="thumb" data-photo="'+s.photoId+'" onclick="viewPhotoInline(\''+s.photoId+'\')">':'')+
 (s.boards||[]).map(b=>'<img class="thumb" data-photo="'+b+'" onclick="viewPhotoInline(\''+b+'\')" alt="メモ">').join('')+
 '<button class="btn blue sm" style="width:56px;flex:0 0 auto" onclick="judge(\''+s.id+'\',\'approved\')">承認</button>'+
 '<button class="btn ghost sm" style="width:60px;flex:0 0 auto;color:#B04040" onclick="judge(\''+s.id+'\',\'rejected\')">却下</button></div>';}
function judge(id,st){const s=P().sessions.find(x=>x.id===id);if(!s)return;
 s.status=st;save();
 const row=$('#ps-'+id);if(row)row.remove();}
function addPool(){const v=$('#pool-new').value.trim();if(!v)return;
 const pr=Math.max(0,Number($('#pool-price').value)||500);
 P().pool.push({name:v,price:pr});save();openParent();}
function delPool(i){P().pool.splice(i,1);save();openParent();}
function changePin(){const v=$('#pin-chg').value;
 if(!/^\d{4}$/.test(v)){alert('4けたの数字で!');return;}
 S.parentPin=v;save();$('#pin-chg').value='';alert('PINを変更しました🔐');}
/* --- APIキー取得ガイド --- */
function keyGuide(){openModal('<h3>🔑 AI相棒のカギ(APIキー)のもらいかた</h3>'+
 '<div class="muted" style="margin-bottom:10px">GoogleのAI「Gemini」の無料キーを使います。クレジットカード登録は不要で、個人利用なら無料枠で十分です。保護者の方が操作してください。</div>'+
 '<div class="sess"><span class="em">1️⃣</span><div class="info">下のボタンから <b>Google AI Studio</b> を開き、お手持ちの<b>Googleアカウント</b>でログインします。</div></div>'+
 '<div class="sess"><span class="em">2️⃣</span><div class="info">画面の <b>「Get API key(APIキーを取得)」</b> → <b>「Create API key(APIキーを作成)」</b> を押します。</div></div>'+
 '<div class="sess"><span class="em">3️⃣</span><div class="info"><b>AIza…</b> ではじまる長い文字列が出るので<b>コピー</b>します。</div></div>'+
 '<div class="sess"><span class="em">4️⃣</span><div class="info">このアプリにもどって、パパ・ママモードの<b>APIキー欄に貼り付け</b>、「まとめて保存」を押せば完了です🎉</div></div>'+
 '<a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" style="display:block;text-decoration:none;margin-top:12px">'+
 '<span class="btn blue sm" style="display:block;text-align:center">Google AI Studio をひらく ↗</span></a>'+
 '<div class="muted" style="margin-top:10px">⚠️ 注意:キーは<b>お子さんには教えず</b>、他の人と共有しないでください。キーはこの端末の中にだけ保存されます。無料枠を超える心配はほぼありませんが、Googleアカウントの管理画面からいつでもキーを削除(無効化)できます。</div>'+
 '<button class="btn ghost sm" style="margin-top:12px" onclick="closeModal();openParent()">← パパ・ママモードにもどる</button>');}
function saveParent(){
 const p=P();
 
 // 入力された値を確実に取得して状態(S)に保存
 if($('#tgt-label')) p.examTarget.label=$('#tgt-label').value.trim();
 if($('#tgt-value')) p.examTarget.value=$('#tgt-value').value.trim();
 
 document.querySelectorAll('[data-bg-t]').forEach(inp=>{p.bigGoals[Number(inp.dataset.bgT)].title=inp.value;});
 document.querySelectorAll('[data-bg-r]').forEach(inp=>{p.bigGoals[Number(inp.dataset.bgR)].reward=inp.value;});
 
 // ごほうび券の名前と価格
 document.querySelectorAll('[data-pool-n]').forEach(inp=>{const i=Number(inp.dataset.poolN);
  if(p.pool[i]&&inp.value.trim())p.pool[i].name=inp.value.trim();});
 document.querySelectorAll('[data-pool-p]').forEach(inp=>{const i=Number(inp.dataset.poolP);
  if(p.pool[i])p.pool[i].price=Math.max(0,Number(inp.value)||0);});
 
 // メンバー
 document.querySelectorAll('[data-pf-em]').forEach(i=>{const pr=S.profiles[i.dataset.pfEm];if(pr&&i.value.trim())pr.em=i.value.trim();});
 document.querySelectorAll('[data-pf-nm]').forEach(i=>{const pr=S.profiles[i.dataset.pfNm];if(pr&&i.value.trim())pr.name=i.value.trim();});
 document.querySelectorAll('[data-pf-gr]').forEach(i=>{const pr=S.profiles[i.dataset.pfGr];if(pr)pr.grade=i.value.trim();});
 // きち
 document.querySelectorAll('[data-bs-em]').forEach(i=>{const b=S.bases[Number(i.dataset.bsEm)];if(b&&i.value.trim())b.em=i.value.trim();});
 document.querySelectorAll('[data-bs-nm]').forEach(i=>{const b=S.bases[Number(i.dataset.bsNm)];if(b&&i.value.trim())b.name=i.value.trim();});
 
 if($('#gm-key')) S.gemini.key=$('#gm-key').value.trim();
 if($('#gm-model')) S.gemini.model=$('#gm-model').value.trim()||'gemini-3.5-flash';
 
 save();      // localStorageへ保存
 closeModal(); // モーダルを閉じる
 render();     // 画面を再描画
 alert('保存しました！これでお子様もAI相棒と話せますよ🤖✨');
}
/* ---------- バックアップ ---------- */
function exportData(){const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='studykichi-backup.json';a.click();}
function importData(inp){const f=inp.files&&inp.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.profiles)throw 0;
  if(confirm('今のデータを上書きして復元しますか?')){
   S=Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)),s);migrate(S);save();closeModal();render();}}
  catch(e){alert('ファイルが読めませんでした');}};
 r.readAsText(f);}

/* ---------- PWA ---------- */
if('serviceWorker' in navigator&&location.protocol==='https:'){
 window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
window.deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
 e.preventDefault();window.deferredPrompt=e;
 if(S.tab==='set')render();});

/* ---------- 起動 ---------- */
render();

</script>
