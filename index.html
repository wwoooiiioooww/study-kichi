<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#8EC8F2">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="スタディきち">
<title>スタディきち</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* きせかえで applyTheme() が上書きするテーマ変数(既定=sky) */
  --sky-bg:#EAF4FC; --sky-deep:#CDE5F7;
  --bg-top:#BBDDF5; --hd1:#8EC8F2; --hd2:#B9DFF8;
  --ink:#2B3A55; --ink-soft:#6B7C99;
  --blue:#3E8FD8; --blue-d:#2F6FB0;
  --orange:#FF8A5C; --orange-d:#F0703F;
  --gold:#FFC53D; --green:#58C08A;
  --card:#FFFFFF; --line:#D8E6F2;
  --danger:#E86A6A;
  --r:20px;
  --disp:'M PLUS Rounded 1c',sans-serif;
  --body:'Zen Kaku Gothic New',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--body);color:var(--ink);
  background:linear-gradient(180deg,var(--bg-top) 0%,var(--sky-bg) 40%);
  background-attachment:fixed;
}
#shell{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--sky-bg);
  box-shadow:0 0 40px rgba(62,143,216,.15);position:relative;padding-bottom:84px}
/* ---------- sky header ---------- */
.sky{position:relative;overflow:hidden;padding:18px 18px 22px;
  background:linear-gradient(180deg,var(--hd1) 0%,var(--hd2) 70%,var(--sky-bg) 100%);
  border-radius:0 0 28px 28px}
.cloud{position:absolute;background:#fff;border-radius:50px;opacity:.85;filter:blur(1px)}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.c1{width:90px;height:26px;top:16px;left:-100px;animation:drift 46s linear infinite}
.c1::before{width:38px;height:38px;top:-18px;left:14px}
.c1::after{width:26px;height:26px;top:-12px;left:46px}
.c2{width:64px;height:20px;top:58px;left:-80px;animation:drift 68s linear 8s infinite;opacity:.6}
.c2::before{width:28px;height:28px;top:-13px;left:10px}
.c2::after{width:18px;height:18px;top:-8px;left:34px}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(620px)}}
@media (prefers-reduced-motion:reduce){.cloud{animation:none;left:20%}.c2{left:60%}}
.sky h1{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:.02em;position:relative}
.sky .sub{font-size:12px;color:#2F6FB0;margin-top:2px;position:relative}
.profile-row{display:flex;gap:10px;margin-top:14px;position:relative}
.pf{flex:1;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.75);
  border:2px solid transparent;border-radius:16px;padding:8px 10px;cursor:pointer;
  font-family:var(--disp);font-weight:700;font-size:14px;transition:.15s}
.pf.on{border-color:var(--blue);background:#fff;box-shadow:0 4px 12px rgba(62,143,216,.25)}
.pf .em{font-size:22px}
.pf .g{font-size:10px;color:var(--ink-soft);font-weight:500}
/* ---------- common ---------- */
main{padding:16px 16px 8px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;
  box-shadow:0 2px 10px rgba(43,58,85,.06)}
h2{font-family:var(--disp);font-weight:800;font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.muted{color:var(--ink-soft);font-size:12px}
.btn{display:block;width:100%;border:none;border-radius:16px;padding:14px;cursor:pointer;
  font-family:var(--disp);font-weight:800;font-size:16px;color:#fff;
  background:linear-gradient(180deg,var(--orange),var(--orange-d));
  box-shadow:0 4px 0 #D65E30;transition:.1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #D65E30}
.btn.blue{background:linear-gradient(180deg,var(--blue),var(--blue-d));box-shadow:0 4px 0 #245A92}
.btn.blue:active{box-shadow:0 1px 0 #245A92}
.btn.ghost{background:#fff;color:var(--blue-d);border:2px solid var(--line);box-shadow:none;font-weight:700}
.btn.sm{padding:9px;font-size:13px;border-radius:12px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px}
.row>*{flex:1}
input,textarea,select{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px;
  font-family:var(--body);font-size:14px;background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--blue);border-color:var(--blue)}
label{font-size:12px;font-weight:700;color:var(--ink-soft);display:block;margin:10px 0 4px}
/* ---------- home ---------- */
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:#fff;border-radius:16px;padding:10px;text-align:center;box-shadow:0 2px 8px rgba(43,58,85,.05)}
.stat .n{font-family:var(--disp);font-weight:800;font-size:20px;color:var(--blue-d)}
.stat .l{font-size:10px;color:var(--ink-soft);font-weight:700}
.bases{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.base{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 10px;text-align:center;cursor:pointer;transition:.12s}
.base:active{transform:scale(.96)}
.base .em{font-size:30px}
.base .nm{font-family:var(--disp);font-weight:700;font-size:13px;margin-top:4px}
.base .cnt{font-size:10px;color:var(--ink-soft);margin-top:2px}
.base .ttl{display:inline-block;font-size:10px;font-weight:700;color:#B07800;background:#FFF3D1;border-radius:8px;padding:1px 7px;margin-top:4px}
/* ---------- timer ---------- */
.timer-wrap{text-align:center;padding:26px 0 10px}
.timer-base{font-family:var(--disp);font-weight:700;color:var(--blue-d);font-size:14px}
.timer-num{font-family:var(--disp);font-weight:800;font-size:64px;letter-spacing:.02em;margin:6px 0}
.timer-num.over{color:var(--green)}
.cheer{min-height:20px;font-size:13px;color:var(--ink-soft)}
.ring{width:190px;height:190px;margin:10px auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;
  font-family:var(--disp);font-weight:700;font-size:13px;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
/* ---------- slot ---------- */
.slot-box{background:linear-gradient(180deg,#2B3A55,#1D2A42);border-radius:24px;padding:22px 16px;text-align:center;color:#fff}
.slot-title{font-family:var(--disp);font-weight:800;font-size:16px;color:var(--gold)}
.reels{display:flex;justify-content:center;gap:10px;margin:16px 0}
.reel{width:76px;height:86px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:44px;box-shadow:inset 0 -6px 0 #E4EDF6}
.reel.spin{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:translateY(-3px)}50%{transform:translateY(3px)}100%{transform:translateY(-3px)}}
.slot-result{font-family:var(--disp);font-weight:800;font-size:17px;min-height:26px;color:var(--gold)}
/* ---------- grass ---------- */
.grass{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;overflow-x:auto;padding-bottom:4px}
.g0{background:#E4EDF6}.g1{background:#BCE3CB}.g2{background:#7FD0A0}.g3{background:#43A96F}
.grass i{border-radius:3px;display:block}
.streak-flame{font-size:26px}
/* ---------- session list ---------- */
.sess{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.sess:last-child{border-bottom:none}
.sess .em{font-size:22px}
.sess .info{flex:1;font-size:12px}
.sess .info b{font-family:var(--disp);font-size:13px}
.badge{font-size:10px;font-weight:700;border-radius:8px;padding:2px 8px}
.b-pend{background:#FFF3D1;color:#B07800}
.b-ok{background:#DDF3E6;color:#2C7A4E}
.b-ng{background:#FBE1E1;color:#B04040}
.thumb{width:42px;height:42px;object-fit:cover;border-radius:10px;cursor:pointer;border:2px solid var(--line)}
.thumb-miss{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--sky-deep);border-style:dashed;opacity:.8;font-size:17px}
/* ---------- goals ---------- */
.goal-card{background:linear-gradient(135deg,#FFF6E3,#FFEAC2);border:2px solid #FFD98A;border-radius:var(--r);padding:14px;margin-bottom:12px}
.goal-card .rw{font-family:var(--disp);font-weight:800;font-size:15px;color:#9A6B00}
.goal-card .tt{font-size:12px;color:#B07800;font-weight:700}
.chart-wrap{overflow-x:auto}
/* ---------- chat ---------- */
.chat-log{display:flex;flex-direction:column;gap:10px;min-height:200px;max-height:52vh;overflow-y:auto;padding:4px 0}
.msg{max-width:82%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:#fff;border:2px solid var(--line);border-bottom-left-radius:4px}
.msg.ai .who{font-size:10px;font-weight:700;color:var(--blue-d);margin-bottom:2px}
.chat-input{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chat-input textarea{flex:1 1 100%;resize:none;height:96px;font-size:16px}
.chat-input .send-btn{flex:1;min-height:46px;border:none;border-radius:14px;background:var(--blue);color:#fff;font-family:var(--disp);font-weight:800;font-size:15px;cursor:pointer}
.typing{font-size:12px;color:var(--ink-soft)}
.day-sep{display:flex;align-items:center;gap:8px;margin:2px 0}
.day-sep::before,.day-sep::after{content:"";flex:1;height:1px;background:var(--line)}
.day-sep span{font-size:10px;color:var(--ink-soft);font-weight:700}
/* ---------- ページ入力(作戦・バトル) ---------- */
.pg-row{display:flex;gap:8px;align-items:center;margin-top:6px}
.pg-row .lb{flex:0 0 68px;font-size:12px;font-weight:700;color:var(--ink-soft)}
.pg-row input{flex:1;min-width:0;text-align:center;padding:10px 4px;font-size:16px}
.pg-row button{flex:0 0 44px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
/* ---------- メモボード ---------- */
.bd-tools{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.bd-pen{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.bd-tl{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:16px;cursor:pointer}
.bd-pen.on,.bd-tl.on{box-shadow:0 0 0 3px var(--blue)}
#board{width:100%;background:#fff;border:2px solid var(--line);border-radius:14px;touch-action:none;display:block}
/* ---------- nav ---------- */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:#fff;border-top:1px solid var(--line);display:flex;z-index:50;
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:none;background:none;padding:9px 0 7px;cursor:pointer;color:var(--ink-soft);
  font-family:var(--disp);font-weight:700;font-size:10px;position:relative;transition:.15s}
nav button .i{display:block;font-size:20px;margin-bottom:1px;transition:.15s}
nav button.on{color:var(--blue-d);background:linear-gradient(180deg,#DCEDFA,#FFFFFF)}
nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 4px 4px;background:var(--blue)}
nav button.on .i{transform:scale(1.2)}
/* PIN入力: type=password だとパスワードマネージャーが保存候補を出してきて邪魔なので、
   マスク表示できる環境では text + text-security にする(非対応環境は password にフォールバック) */
.pin-mask{-webkit-text-security:disc;text-security:disc}
/* 「ここだよ」の合図。作戦カードへ飛んだときに数回ふわっと光らせる */
@keyframes flash{0%,100%{outline-color:rgba(62,143,216,0)}50%{outline-color:rgba(62,143,216,.9)}}
.card.flash{outline:3px solid rgba(62,143,216,0);outline-offset:3px;animation:flash .62s ease-in-out 3}
/* ---------- FAB(ホーム以外のタブから しゅつげき / タイマーにもどる) ---------- */
#fab-wrap{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:480px;bottom:0;z-index:40;
  display:flex;justify-content:flex-end;padding:0 14px 62px;pointer-events:none;
  margin-bottom:env(safe-area-inset-bottom)}
.fab{pointer-events:auto;border:none;border-radius:999px;padding:13px 20px;cursor:pointer;
  font-family:var(--disp);font-weight:800;font-size:14px;color:#fff;
  background:linear-gradient(135deg,var(--blue),var(--blue-d));box-shadow:0 6px 18px rgba(62,143,216,.45)}
.fab.run{background:linear-gradient(135deg,#F5A671,#E07B3C);box-shadow:0 6px 18px rgba(224,123,60,.45)}
body.has-fab #shell{padding-bottom:124px} /* FABが最後のカードに かぶらないように */
/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(30,42,66,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:20px 18px 26px;max-height:88dvh;overflow-y:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.modal{animation:none}}
.modal h3{font-family:var(--disp);font-weight:800;font-size:16px;margin-bottom:12px}
.close-x{float:right;border:none;background:#EEF4FA;border-radius:50%;width:30px;height:30px;font-size:14px;cursor:pointer;color:var(--ink-soft)}
.photo-view{max-width:100%;border-radius:14px}
/* confetti */
.confetti{position:fixed;top:-10px;font-size:18px;z-index:200;animation:fall 2.4s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.7}}
/* ---------- パパ・ママモードの折りたたみセクション ---------- */
.pd{border:2px solid var(--line);border-radius:14px;margin-top:10px;background:#fff}
.pd summary{cursor:pointer;padding:11px 12px;font-family:var(--disp);font-weight:800;font-size:14px;
  list-style:none;display:flex;align-items:center;gap:6px;-webkit-user-select:none;user-select:none}
.pd summary::-webkit-details-marker{display:none}
.pd summary::after{content:"▾";margin-left:auto;color:var(--ink-soft);transition:.15s}
.pd[open] summary::after{transform:rotate(180deg)}
.pd[open] summary{border-bottom:1px dashed var(--line)}
.pd .pd-body{padding:2px 12px 12px}
/* ---------- 🚀ロケットOP(起動スプラッシュ) ---------- */
#splash{position:fixed;inset:0;z-index:500;overflow:hidden;cursor:pointer;
  background:linear-gradient(180deg,var(--hd1) 0%,var(--hd2) 55%,var(--sky-bg) 100%)}
.spl-cloud{position:absolute;background:#fff;border-radius:50px;opacity:.9}
.spl-cloud::before,.spl-cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.spl-c1{width:96px;height:28px;top:22%;left:14%}
.spl-c1::before{width:40px;height:40px;top:-19px;left:15px}
.spl-c1::after{width:26px;height:26px;top:-12px;left:50px}
.spl-c2{width:70px;height:22px;top:55%;right:12%;opacity:.7}
.spl-c2::before{width:30px;height:30px;top:-14px;left:11px}
.spl-c2::after{width:20px;height:20px;top:-9px;left:38px}
.spl-rocket{position:absolute;left:50%;bottom:-120px;transform:translateX(-50%);
  animation:spl-fly 1.1s cubic-bezier(.5,.05,.75,.9) .1s forwards}
.spl-ship{display:block;font-size:58px;line-height:1;transform:rotate(-45deg)}
.spl-flame{display:block;text-align:center;font-size:28px;margin-top:-4px;animation:spl-flick .14s linear infinite alternate}
@keyframes spl-fly{to{transform:translateX(-50%) translateY(-140vh)}}
@keyframes spl-flick{from{opacity:.55;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.ticket-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ticket-item button{border:none;background:#FBE1E1;color:#B04040;border-radius:8px;padding:4px 10px;font-size:11px;cursor:pointer}
.won-ticket{background:linear-gradient(90deg,#FFF6E3,#FFEFD0);border:2px dashed var(--gold);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.won-ticket button{border:none;background:var(--green);color:#fff;border-radius:10px;padding:6px 12px;font-family:var(--disp);font-weight:700;cursor:pointer;font-size:12px}
/* ---------- chat photo / quick ---------- */
.chat-quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qchip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-family:var(--disp);font-weight:700;font-size:12px;color:var(--blue-d);cursor:pointer}
.qchip:active{transform:scale(.96)}
.attach-btn{flex:0 0 auto;width:46px;min-height:46px;border:2px solid var(--line);background:#fff;border-radius:14px;font-size:20px;cursor:pointer}
.attach-btn:active{background:#EEF4FA}
.attach-btn.rec{background:#FBE1E1;border-color:var(--danger);animation:pulse 1s ease infinite}
@keyframes pulse{50%{opacity:.6}}
.chat-photo{display:block;max-width:180px;border-radius:12px;margin-bottom:6px}
.photo-chip{display:flex;align-items:center;gap:8px;background:#EEF4FA;border:2px solid var(--line);border-radius:12px;padding:6px 8px;margin-top:8px;font-size:12px;font-weight:700;color:var(--ink-soft)}
.photo-chip img{width:44px;height:44px;object-fit:cover;border-radius:8px}
.photo-chip button{margin-left:auto;border:none;background:#FBE1E1;color:#B04040;border-radius:8px;width:26px;height:26px;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<div id="shell">
  <header class="sky">
    <div class="cloud c1"></div><div class="cloud c2"></div>
    <h1 id="hd-title">スタディきち ☁️</h1>
    <div class="sub" id="hd-sub"></div>
    <div class="profile-row" id="profile-row"></div>
  </header>
  <main id="app"></main>
  <nav id="nav"></nav>
</div>
<div id="fab-wrap"></div>
<div id="modal-root"></div>
<script>
/* ============================================================
   スタディきち — 空花＆風花のための自習出撃アプリ
   データはこの端末の中だけに保存されます（localStorage / IndexedDB）
   ============================================================ */
/* ---------- マスタ ---------- */
const APP_VER='v21'; // せってい表示とフィードバックの共通バージョン。sw.js の CACHE と同時に上げること
/* 汎用サンプル(配布用)。既存端末の保存済みデータは上書きされない */
const DEFAULT_BASES=[
 {id:'lib',name:'としょかん',em:'📚'},
 {id:'school',name:'図書室',em:'🏫'},
 {id:'jido',name:'じどうかん',em:'🎨'},
 {id:'home',name:'おうち机',em:'🏠'},
 {id:'cafe',name:'きちカフェ',em:'☕'},
];
const TITLES=[[40,'ぬし'],[20,'たつじん'],[10,'じょうれん'],[3,'かよいはじめ']];
const SUBJECTS=['算数','国語','理科','社会','英語','その他'];
/* 🎨きせかえテーマ(単一マスタ)。night はインク色(#2B3A55)が読める明るさを保つ(紺〜藍の範囲) */
const THEMES={
 sky:   {name:'そら',    em:'☁️',vars:{'--sky-bg':'#EAF4FC','--sky-deep':'#CDE5F7','--bg-top':'#BBDDF5','--hd1':'#8EC8F2','--hd2':'#B9DFF8'}},
 sakura:{name:'さくら',  em:'🌸',vars:{'--sky-bg':'#FDF1F5','--sky-deep':'#F8D8E6','--bg-top':'#F6CFDF','--hd1':'#F2A9C7','--hd2':'#F9D2E1'}},
 sunset:{name:'ゆうやけ',em:'🌇',vars:{'--sky-bg':'#FDF4EB','--sky-deep':'#FADDC4','--bg-top':'#F8CBA4','--hd1':'#F5A671','--hd2':'#FACD9F'}},
 night: {name:'よぞら',  em:'🌙',vars:{'--sky-bg':'#EAEEF7','--sky-deep':'#CCD5EB','--bg-top':'#93A3CB','--hd1':'#6478A8','--hd2':'#96A8D0'}},
 sea:   {name:'うみ',    em:'🐠',vars:{'--sky-bg':'#E9F6F4','--sky-deep':'#C8EAE5','--bg-top':'#9CDCD4','--hd1':'#5BC2B7','--hd2':'#90DAD1'}},

function migrate(st){
 Object.entries(st.profiles||{}).forEach(([pid,pr])=>{
  if(Array.isArray(pr.pool))pr.pool=pr.pool.map(t=>typeof t==='string'?{name:t,price:500}:t);
  if(pr.lastGoldenMilestone==null)pr.lastGoldenMilestone=0;

  if(pr.pin===undefined)pr.pin=null;
  if(!pr.weeks)pr.weeks={};
  if(!Array.isArray(pr.bonusSpins))pr.bonusSpins=[];
  pr.bonusSpins.forEach(b=>{if(!b.id)b.id='bs'+Math.random().toString(36).slice(2);
   if(!b.status)b.status='approved';});
  if(!Array.isArray(pr.books))pr.books=[];
  if(!Array.isArray(pr.ownedThemes))pr.ownedThemes=['sky','sakura'];
  ['sky','sakura'].forEach(t=>{if(pr.ownedThemes.indexOf(t)<0)pr.ownedThemes.push(t);});
  if(!pr.theme||pr.ownedThemes.indexOf(pr.theme)<0)pr.theme='sky';
  if(!Array.isArray(pr.missions))pr.missions=[];
  Object.values(pr.weeks).forEach(wx=>{if(!Array.isArray(wx.items))wx.items=[];});
  (pr.exams||[]).forEach(e=>{
   if(!e.scores){e.scores={'総合':Number(e.score)||0};delete e.score;}});
  if(Array.isArray(pr.exams))pr.exams.sort((a,b)=>exSortKey(a)-exSortKey(b));
  /* --- v5(v13-a): 台帳・マージ基盤 --- */
  if(!Array.isArray(pr.ledger)){pr.ledger=[]; // 既存残高は繰越取引に(決定的ID=2端末で同時migrateしても収束)
   const bal=Math.round(Number(pr.points)||0);
   if(bal!==0)pr.ledger.push({id:'tx-init-'+pid,ts:Date.now(),delta:bal,reason:'carryover',ref:null});}
  if(!pr.context||typeof pr.context!=='object')pr.context={about:'',now:'',nowUntil:''};
  ['about','now'].forEach(k=>{pr.context[k]=String(pr.context[k]||'').slice(0,600);});
  pr.context.nowUntil=/^\d{4}-\d{2}-\d{2}$/.test(pr.context.nowUntil||'')?pr.context.nowUntil:'';
  if(!pr.deleted||typeof pr.deleted!=='object')pr.deleted={};
  if(pr.metaMt==null)pr.metaMt=0;
  /* ID採番(内容由来の決定的IDにし、同じ旧データを別端末でmigrateしても収束させる) */
  (pr.exams||[]).forEach((e,i)=>{if(!e.id)e.id='ex-'+(e.date||'x')+'-'+i; if(e.mt==null)e.mt=0;});
  (pr.chat||[]).forEach((m2,i)=>{if(!m2.id)m2.id='cm-'+(m2.ts||0)+'-'+i;});
  (pr.chatArchive||[]).forEach((a,i)=>{if(!a.id)a.id='ca-'+(a.ts||0)+'-'+i;});
  if(Array.isArray(pr.tickets))pr.tickets=pr.tickets.map((t,i)=> // 所持券をオブジェクト化(つかう=usedTs記録)
   typeof t==='string'?{id:'tk-mig-'+i+'-'+t,name:t,ts:0,usedTs:null,mt:0}:t);
  (pr.sessions||[]).forEach(s=>{if(s.mt==null)s.mt=0;});
  (pr.bonusSpins||[]).forEach(b=>{if(b.mt==null)b.mt=0;});
  (pr.missions||[]).forEach(m2=>{if(m2.mt==null)m2.mt=0;});
  Object.values(pr.weeks).forEach(wx=>{if(wx.planMt==null)wx.planMt=0;if(wx.testMt==null)wx.testMt=0;});
  recalcPoints(pr); // points=台帳合計のキャッシュ
 });
 if(!st.deleted||typeof st.deleted!=='object')st.deleted={};
 if(st.basesMt==null)st.basesMt=0;
 if(st.pinMt==null)st.pinMt=0;
 /* v17: リマインダー設定(壊れた値で入ってきても既定値に丸める=import防御) */
 if(!st.planRemind||typeof st.planRemind!=='object')st.planRemind=JSON.parse(JSON.stringify(DEFAULT_STATE.planRemind));
 st.planRemind.on=st.planRemind.on?1:0;
 st.planRemind.day=Math.min(6,Math.max(0,Math.round(Number(st.planRemind.day))||0));
 st.planRemind.max=Math.min(5,Math.max(1,Math.round(Number(st.planRemind.max))||3));
 if(st.planRemindMt==null)st.planRemindMt=0;
 if(!Array.isArray(st.bases)||!st.bases.length)st.bases=JSON.parse(JSON.stringify(DEFAULT_BASES));
 if(!st.currentProfile||!st.profiles[st.currentProfile])st.currentProfile=Object.keys(st.profiles)[0];
 if(st.gemini&&(!st.gemini.model||st.gemini.model==='gemini-2.5-flash'))st.gemini.model='gemini-3.5-flash';
 st.v=5;

/* ---------- ⭐ポイント台帳(全ポイント変動をここに集約) ----------
   fixedId(決定的ID)を渡すと冪等: 同じ取引が2端末で発生してもマージで1件に収束する */
function addLedger(p,delta,reason,ref,fixedId){
 const id=fixedId||('tx-'+reason+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7));
 if(!Array.isArray(p.ledger))p.ledger=[];
 if(p.ledger.some(t=>t.id===id))return false;
 p.ledger.push({id,ts:Date.now(),delta:Math.round(delta),reason,ref:ref==null?null:ref});
 p.points+=Math.round(delta);
 return true;}
function recalcPoints(p){p.points=(p.ledger||[]).reduce((a,t)=>a+(Math.round(t.delta)||0),0);}

/* 4けたPIN入力の共通生成。パスワードマネージャーの自動入力候補を出さないため

const PIN_MASK=(()=>{try{return !!(window.CSS&&CSS.supports&&CSS.supports('-webkit-text-security','disc'));}catch(e){return false;}})();
function pinInput(id,style,ph){
 return '<input id="'+id+'" '+(PIN_MASK?'type="text" class="pin-mask"':'type="password"')+

function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(ts){const d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate();}
function dayKey(ts){const d=new Date(ts);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function todayKey(){return dayKey(Date.now());}
function minutesByDay(p){const m={};p.sessions.forEach(s=>{
 if(s.status!=='rejected'){const k=dayKey(s.endTs||s.startTs);m[k]=(m[k]||0)+(s.minutes||0);}});return m;}
function calcStreak(p){const m=minutesByDay(p);let streak=0;const d=new Date();
 if(!m[dayKey(d.getTime())]){d.setDate(d.getDate()-1);}
 while(m[dayKey(d.getTime())]){streak++;d.setDate(d.getDate()-1);}
 return streak;}
/* --- スロット経済のルール --- */
const MILESTONES=[3,7,14,30,50,100,200];
function coefFor(min){return min<15?0.3:min<45?1:1.5;} // 時間係数
function dayTotal(p,ts){const k=dayKey(ts);let t=0;
 p.sessions.forEach(s=>{if(s.status!=='rejected'&&dayKey(s.endTs||s.startTs)===k)t+=(s.minutes||0);});
 return t;}
function spinQueue(p){return p.sessions.filter(s=>s.status==='approved'&&!s.spin);}
function goldenAvailable(p){const st=calcStreak(p);
 if(st<(p.lastGoldenMilestone||0))p.lastGoldenMilestone=0; // 連続が途切れたらリセット
 let m=0;MILESTONES.forEach(x=>{if(st>=x)m=x;});
 return (m>0&&m>(p.lastGoldenMilestone||0))?m:0;}
function nextMilestone(p){const st=calcStreak(p);
 for(const x of MILESTONES){if(st<x)return x;}return null;}
/* --- 週(日曜はじまり・土曜おわり)ユーティリティ --- */
const WEEK_MS=[2,4,8,12,20,30,50]; // パーフェクトウィーク連続のふしめ
function weekKeyFor(ts){const d=new Date(ts);d.setHours(0,0,0,0);
 d.setDate(d.getDate()+(6-d.getDay()));return dayKey(d.getTime());} // その週の土曜
function prevWeekKey(key){const[y,m,dd]=key.split('-').map(Number);
 return dayKey(new Date(y,m-1,dd-7).getTime());}
function weekRangeLabel(key){const[y,m,dd]=key.split('-').map(Number);
 const sat=new Date(y,m-1,dd);const sun=new Date(y,m-1,dd-6);
 return (sun.getMonth()+1)+'/'+sun.getDate()+'〜'+(sat.getMonth()+1)+'/'+sat.getDate();}
function planTargetKey(){const d=new Date();
 return d.getDay()===6?weekKeyFor(Date.now()+864e5):weekKeyFor(Date.now());} // 土曜は「来週」の作戦
function testTargetKey(){const d=new Date();
 return d.getDay()===0?weekKeyFor(Date.now()-864e5):weekKeyFor(Date.now());} // 日曜は「きのう終わった週」のバトル
function getWeek(p,key){if(!p.weeks[key])p.weeks[key]={subjects:[],range:'',goal:'',planTs:null,test:null,reviews:[],granted:{}};
 if(!p.weeks[key].granted)p.weeks[key].granted={};return p.weeks[key];}
function grantBonus(p,key,wk,kind,reason,golden){if(wk.granted[kind])return false;
 const id='bs-'+key+'-'+kind; // 決定的ID: 2端末が同条件で独立発行してもマージで1件に収束
 if((p.bonusSpins||[]).some(b=>b.id===id))return false;
 wk.granted[kind]=1;
 p.bonusSpins.push({id,reason,golden:!!golden,status:'pending',mt:Date.now()});
 return true;}
function approvedBonus(p){return (p.bonusSpins||[]).filter(b=>b.status==='approved');}
function pendingBonus(p){return (p.bonusSpins||[]).filter(b=>b.status==='pending');}
function weekLoopStreak(p,key){let n=0,k=key;
 while(true){const w=p.weeks[k];if(w&&w.planTs&&w.test){n++;k=prevWeekKey(k);}else break;}
 return n;}
function checkWeekLoop(p,key){const wk=p.weeks[key];if(!wk||!wk.planTs||!wk.test)return;
 if(wk.granted.loopChecked)return;wk.granted.loopChecked=1;
 const st=weekLoopStreak(p,key);
 if(WEEK_MS.indexOf(st)>=0)grantBonus(p,key,wk,'wstreak','🔥パーフェクトウィーク'+st+'週れんぞく!!',true);}
/* ---------- 🎯パパ・ママからの特別ミッション ----------
   報酬は承認ゲート必須(できた!=claimed → 親の承認 → ポイント付与)。
   スロットを経由しない固定ポイント(臨時収入)。 */
function missionDueTs(ms){ // 期限日の23:59:59。期限延長された場合は dueBaseTs 起点で再計算
 if(!ms.due)return null;
 const base=ms.dueBaseTs||ms.createdTs;
 if(ms.due.type==='today'){const d=new Date(base);
  return new Date(d.getFullYear(),d.getMonth(),d.getDate(),23,59,59).getTime();}
 if(ms.due.type==='week'){const[y,m,dd]=weekKeyFor(base).split('-').map(Number);
  return new Date(y,m-1,dd,23,59,59).getTime();} // その週の土曜23:59まで
 if(ms.due.type==='date'&&ms.due.date){const[y,m,dd]=String(ms.due.date).split('-').map(Number);
  return new Date(y,m-1,dd,23,59,59).getTime();}
 return null;}
function missionDueLabel(ms){if(!ms.due)return'';
 if(ms.due.type==='today')return'きょう中!';
 if(ms.due.type==='week')return'こんしゅう中!';
 if(ms.due.type==='date'&&ms.due.date){const a=String(ms.due.date).split('-').map(Number);return a[1]+'/'+a[2]+'まで';}
 return'';}
function checkMissionExpiry(p){let ch=false;const now=Date.now(); // 表示時判定で open→expired
 (p.missions||[]).forEach(ms=>{if(ms.status==='open'){const dt=missionDueTs(ms);
  if(dt&&now>dt){ms.status='expired';ms.expiredTs=now;ch=true;}}});
 if(ch)save();}
function claimedMissions(p){return (p.missions||[]).filter(m=>m.status==='claimed');}
let msCelebrated={}; // 達成カードのconfettiを1セッション1回にする
function missionClaim(id){const p=P();const ms=(p.missions||[]).find(m=>m.id===id);
 if(!ms||ms.status!=='open')return;
 ms.status='claimed';ms.claimedTs=Date.now();ms.mt=Date.now();save();render();}
function missionAck(id){const p=P();const ms=(p.missions||[]).find(m=>m.id===id);
 if(!ms)return;ms.ack=true;ms.mt=Date.now();save();render();}
function judgeMission(id,ok){const p=P();const ms=(p.missions||[]).find(m=>m.id===id);
 if(!ms||ms.status!=='claimed')return;
 if(ok){ms.status='approved';ms.approvedTs=Date.now();ms.ack=false;
  addLedger(p,ms.pts,'mission',ms.title,'tx-ms-'+ms.id); // 決定的ID=マージで二重付与しない
 }else{ms.status='open';ms.claimedTs=null;} // 却下は再挑戦可。消したいときは親が削除
 ms.mt=Date.now();
 save();const row=$('#pm-'+id);if(row)row.remove();}

/* ---------- 📅さくせん会議リマインダー(v17) ----------
   指定曜日から、その週の作戦がたつまで「1日1回・最大N回」だけ声をかける。

   ・モーダル表示中・しゅつげき中・もくひょうタブでは割り込まない */
const NUDGE_LS_KEY='studykichi_nudge';
function nudgeLoad(){try{return JSON.parse(localStorage.getItem(NUDGE_LS_KEY)||'{}');}catch(e){return {};}}
function nudgeSave(o){try{localStorage.setItem(NUDGE_LS_KEY,JSON.stringify(o));}catch(e){}}
function planNudgeDue(nowTs){const now=nowTs||Date.now();
 const r=S.planRemind||{};
 if(!r.on)return null;
 if(new Date(now).getDay()<(r.day||0))return null;   // 設定した曜日より前
 const p=P();const key=planTargetKey();
 if(p.weeks[key]&&p.weeks[key].planTs)return null;   // もう作戦をたてている→即停止
 const all=nudgeLoad();const k=S.currentProfile+'|'+key;const st=all[k]||{n:0,d:''};
 if(st.n>=(r.max||3))return null;                    // 回数ぶん出しきった→来週まで待つ
 if(st.d===dayKey(now))return null;                  // きょうはもう出した
 return {key,k,all,st,now};}
/* ---------- 🤖Personal Context(v20) ----------
   親が書いた「この子について(長期)」と「いまのできごと(短期+期限)」を、
   AI相棒の会話・週次レポート・カムバックナッジに効かせる */
function dstr(s){const a=String(s||'').split('-').map(Number);
 return (a.length===3&&a.every(n=>!isNaN(n)))?new Date(a[0],a[1]-1,a[2]).getTime():null;}
function midnight(ts){const d=new Date(ts||Date.now());d.setHours(0,0,0,0);return d.getTime();}
function ctxNowActive(p,nowTs){const c=p.context||{};if(!c.now)return null;
 const u=dstr(c.nowUntil);
 if(u==null)return {text:c.now,until:''};              // 期限なし=ずっと有効
 return midnight(nowTs)<=u?{text:c.now,until:c.nowUntil}:null;}
function ctxNowJustEnded(p,nowTs){const c=p.context||{};if(!c.now)return null;
 const u=dstr(c.nowUntil);if(u==null)return null;
 const d=Math.round((midnight(nowTs)-u)/864e5);
 return (d>=1&&d<=7)?{text:c.now,until:c.nowUntil}:null;} // 終わった翌日〜1週間だけ「おかえり」
/* 👋カムバックナッジ: できごとが終わった翌日に1回だけ。追撃しない */

 const p=P();const ev=ctxNowJustEnded(p);if(!ev)return false;
 const all=nudgeLoad();const k='back|'+S.currentProfile+'|'+ev.until;
 if(all[k])return false;
 all[k]=1;nudgeSave(all);

  '<button class="btn ghost sm" style="margin-top:8px" onclick="closeModal()">あとで</button>');
 return true;}

function compressImage(file){return new Promise(res=>{
 const img=new Image();
 img.onload=()=>{const max=900;let w=img.width,h=img.height;
  if(w>max||h>max){const r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}
  const c=document.createElement('canvas');c.width=w;c.height=h;
  c.getContext('2d').drawImage(img,0,0,w,h);
  URL.revokeObjectURL(img.src);res(c.toDataURL('image/jpeg',.6));};
 img.src=URL.createObjectURL(file);});}

let bd={};
function openBoard(){
 openModal('<h3>✏️ 計算メモボード</h3>'+
 '<div class="bd-tools">'+
  ['#2B3A55','#3E8FD8','#E86A6A'].map((c,i)=>'<button class="bd-pen'+(i===0?' on':'')+'" data-c="'+c+'" style="background:'+c+'"></button>').join('')+
  '<button class="bd-tl" id="bd-eraser">🧽</button>'+
  '<button class="bd-tl" onclick="bdUndo()">↩️</button>'+
  '<button class="bd-tl" onclick="bdClear()">🗑️</button></div>'+
 '<canvas id="board"></canvas>'+
 '<div class="row" style="margin-top:10px"><button class="btn sm" onclick="saveBoard()">💾 ほぞんする</button>'+
 '<button class="btn ghost sm" onclick="closeBoard()">とじる</button></div>'+
 '<div class="muted" style="margin-top:6px">ほぞんすると「きろく」にのこって、あとから見かえせるよ</div>',false);
 initBoard();}
function initBoard(){const cv=$('#board');
 const dpr=Math.min(2,window.devicePixelRatio||1);
 const w=cv.clientWidth||320,h=440;
 cv.width=w*dpr;cv.height=h*dpr;cv.style.height=h+'px';
 const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
 ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
 ctx.lineCap='round';ctx.lineJoin='round';
 bd={cv,ctx,w,h,color:'#2B3A55',eraser:false,drawing:false,dirty:false,undo:[]};
 cv.addEventListener('pointerdown',bdDown);
 cv.addEventListener('pointermove',bdMove);
 window.addEventListener('pointerup',bdUp);
 document.querySelectorAll('.bd-pen').forEach(b=>b.onclick=()=>{
  bd.color=b.dataset.c;bd.eraser=false;bdMark(b);});
 $('#bd-eraser').onclick=()=>{bd.eraser=true;bdMark($('#bd-eraser'));};}
function bdMark(btn){document.querySelectorAll('.bd-pen,.bd-tl').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
function bdPos(e){const r=bd.cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
function bdDown(e){e.preventDefault();
 if(bd.cv.setPointerCapture)try{bd.cv.setPointerCapture(e.pointerId);}catch(_){ }
 bdSnap();bd.drawing=true;bd.dirty=true;
 const[x,y]=bdPos(e);bd.ctx.beginPath();bd.ctx.moveTo(x,y);bdStroke(x+0.1,y+0.1);}
function bdMove(e){if(!bd.drawing)return;e.preventDefault();const[x,y]=bdPos(e);bdStroke(x,y);}
function bdStroke(x,y){const c=bd.ctx;
 c.strokeStyle=bd.eraser?'#fff':bd.color;c.lineWidth=bd.eraser?26:3;
 c.lineTo(x,y);c.stroke();}
function bdUp(){if(bd)bd.drawing=false;}
function bdSnap(){if(!bd.cv)return;bd.undo.push(bd.cv.toDataURL());if(bd.undo.length>10)bd.undo.shift();}
function bdUndo(){const d=bd.undo.pop();if(!d)return;
 const img=new Image();img.onload=()=>{bd.ctx.drawImage(img,0,0,bd.w,bd.h);};img.src=d;}
function bdClear(){bdSnap();bd.ctx.fillStyle='#fff';bd.ctx.fillRect(0,0,bd.w,bd.h);}
async function saveBoard(){if(!bd.cv)return;
 const d=bd.cv.toDataURL('image/jpeg',.7);
 const id='m'+Date.now();
 try{await putPhoto(id,d);}catch(e){alert('ほぞんできなかった…もういちど ためしてね');return;}
 if(S.activeSession){(S.activeSession.boards=S.activeSession.boards||[]).push(id);save();}
 bd.dirty=false;
 window.removeEventListener('pointerup',bdUp);
 closeModal();render();}
function closeBoard(){
 if(bd.dirty){if(!confirm('ほぞんしていないメモは きえちゃうよ。とじる?'))return;}
 window.removeEventListener('pointerup',bdUp);
 closeModal();}

/* ---------- スロット(承認後にまとめて回せる) ----------
   確率(通常):  3% 券ジャックポット / 9% 👑+100pt / 25% ⭐+50pt / 63% 🍀+10〜30pt
   確率(ゴールデン): 8% / 20% / 35% / 37%
   ポイントには時間係数がかかる: 15分未満×0.3 / 15〜44分×1.0 / 45分以上×1.5
   券ジャックポットは「その日の合計25分以上」のセッションだけ抽選対象 */
const EMO=['🍀','⭐','🍩','🎈','🌸','🍃','👑'];
let slotQueue=[];let goldenM=0;
function openSlots(){const p=P();
 slotQueue=spinQueue(p).map(s=>({t:'s',id:s.id}));
 approvedBonus(p).forEach(b=>slotQueue.push({t:'b',bid:b.id,reason:b.reason,golden:b.golden}));
 if(!slotQueue.length)return;
 goldenM=goldenAvailable(p);
 showSlotModal();}
function showSlotModal(){const item=slotQueue[0];
 if(!item){closeModal();render();return;}
 const golden=item.t==='b'?!!item.golden:goldenM>0;
 const title=item.t==='b'?'🎁 ボーナススロット':(golden?'🔥 ゴールデンスロット 🔥':'🎰 がんばりスロット 🎰');
 const sub=item.t==='b'
  ?'<div style="font-size:12px;color:#FFE9A8;margin-top:2px">'+esc(item.reason)+(golden?' 🔥大当たりしやすいよ!':'')+'</div>'
  :(golden?'<div style="font-size:12px;color:#FFE9A8;margin-top:2px">れんぞく'+goldenM+'日たっせいのごほうび!大当たりしやすいよ✨</div>':'');
 openModal('<div class="slot-box"'+(golden?' style="background:linear-gradient(180deg,#6E4E00,#2E2300);outline:3px solid var(--gold)"':'')+'>'+
 '<div class="slot-title">'+title+'</div>'+sub+
 '<div class="reels"><div class="reel" id="r0">❔</div><div class="reel" id="r1">❔</div><div class="reel" id="r2">❔</div></div>'+
 '<div class="slot-result" id="slot-res"></div>'+
 '<button class="btn" id="spin-btn" style="margin-top:10px">まわす!(あと'+slotQueue.length+'回)</button></div>',false);
 $('#spin-btn').onclick=spinNext;}
function spinNext(){const p=P();const item=slotQueue[0];
 if(!item){closeModal();render();return;}
 let golden,c,dayOk,sess=null;
 if(item.t==='s'){sess=p.sessions.find(x=>x.id===item.id);
  if(!sess){slotQueue.shift();showSlotModal();return;}
  golden=goldenM>0;
  c=coefFor(sess.minutes||0);
  dayOk=dayTotal(p,sess.endTs||sess.startTs)>=25;}
 else{golden=!!item.golden;c=1;dayOk=true;} // ボーナスは時間係数なし・ジャックポット対象
 const btn=$('#spin-btn');btn.disabled=true;
 const reels=[$('#r0'),$('#r1'),$('#r2')];
 reels.forEach(r=>r.classList.add('spin'));
 const spinI=setInterval(()=>reels.forEach(r=>{r.textContent=EMO[Math.floor(Math.random()*EMO.length)];}),80);
 const roll=Math.random();
 const pT=golden?.04:.01, pG=golden?.20:.09, pM=golden?.35:.25;
 let res;
 if(roll<pT&&p.pool.length&&dayOk){const t=p.pool[Math.floor(Math.random()*p.pool.length)];
  res={pts:0,ticket:t.name,face:['🎟️','🎟️','🎟️'],msg:'🌈けんジャックポット!!「'+t.name+'」をタダでゲット!!',big:true};}
 else if(roll<pT+pG){res={pts:Math.max(1,Math.round(100*c)),face:['👑','👑','👑'],big:true};}
 else if(roll<pT+pG+pM){res={pts:Math.max(1,Math.round(50*c)),face:['⭐','⭐','⭐']};}
 else{const v=10+Math.floor(Math.random()*3)*10;
  res={pts:Math.max(1,Math.round(v*c)),face:['🍀','⭐','🌸'].sort(()=>Math.random()-.5)};}
 if(!res.msg)res.msg=(res.big?'✨大当たり!! ':'')+'+'+res.pts+'ポイント!'+(item.t==='s'&&c!==1?'(べんきょう時間ボーナス ×'+c+')':'');
 setTimeout(()=>{clearInterval(spinI);
  reels.forEach((r,i)=>{r.classList.remove('spin');r.textContent=res.face[i];});
  $('#slot-res').textContent=res.msg;
  const spinKey=(item.t==='s'?item.id:item.bid); // 決定的ID: 同一スピンは台帳・券とも1件に収束
  if(res.pts)addLedger(p,res.pts,'slot',null,'tx-spin-'+spinKey);
  if(res.ticket&&!p.tickets.some(t=>t.id==='tk-spin-'+spinKey))
   p.tickets.push({id:'tk-spin-'+spinKey,name:res.ticket,ts:Date.now(),usedTs:null,mt:Date.now()});
  if(sess){sess.spin=(golden?'🔥':'')+res.msg;sess.mt=Date.now();
   if(golden){p.lastGoldenMilestone=goldenM;goldenM=0;}}
  else{const bb=p.bonusSpins.find(b2=>b2.id===item.bid);
   if(bb){bb.status='used';bb.mt=Date.now();}} // 削除でなく消費マーク(マージでの蘇り防止)
  slotQueue.shift();save();
  if(res.big)confetti();
  btn.disabled=false;
  if(slotQueue.length){btn.textContent='つぎのスロットへ(あと'+slotQueue.length+'回)🎰';btn.onclick=showSlotModal;}
  else{btn.textContent='とじる';btn.onclick=()=>{closeModal();render();};}
 },1600);}

let recMode='day';
function setRecMode(m){recMode=m;render();}
function recBars(p){const m=minutesByDay(p);const data=[];
 if(recMode==='day'){
  const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-13);
  for(let i=0;i<14;i++){const k=dayKey(d.getTime());
   data.push({label:(d.getMonth()+1)+'/'+d.getDate(),v:m[k]||0});
   d.setDate(d.getDate()+1);}
 }else{
  const now=new Date();
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);
   const pref=d.getFullYear()+'-'+(d.getMonth()+1)+'-';
   let t=0;Object.entries(m).forEach(([k,v])=>{if(k.indexOf(pref)===0)t+=v;});
   data.push({label:(d.getMonth()+1)+'月',v:t});}}
 const bw=recMode==='day'?21:44,gap=recMode==='day'?8:24;
 const W=Math.max(320,data.length*(bw+gap)+36),H=170,pad=28;
 const max=Math.max(10,...data.map(x=>x.v));
 let svg='<svg width="'+W+'" height="'+H+'">';
 data.forEach((x,i)=>{const h=(x.v/max)*(H-pad*2);
  const bx=22+i*(bw+gap),by=H-pad-h;
  if(x.v>0){svg+='<rect x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+Math.max(h,3)+'" rx="5" fill="'+(x.v>=45?'#43A96F':x.v>=20?'#7FD0A0':'#BCE3CB')+'"/>'+
   '<text x="'+(bx+bw/2)+'" y="'+(by-5)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#2B3A55">'+(recMode==='month'&&x.v>=60?(Math.round(x.v/6)/10)+'h':x.v)+'</text>';}
  else{svg+='<rect x="'+bx+'" y="'+(H-pad-2)+'" width="'+bw+'" height="2" rx="1" fill="#E4EDF6"/>';}
  svg+='<text x="'+(bx+bw/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" fill="#6B7C99">'+x.label+'</text>';});
 return svg+'</svg>';}

 planDraft={key,pid:S.currentProfile,
  subjects:(wk.subjects||[]).slice(),

  range:wk.range||''};

 else{d.subjects.push(sj);

 const it=d.items.find(x=>x.subj===sj);if(!it)return;
 it[field]=(field==='text')?val:Math.max(1,Number(val)||1);}

 it[field]=Math.max(1,(Number(it[field])||1)+delta);

function savePlan(){const p=P();const d=ensureDraft(p);const key=d.key;
 if(!d.subjects.length){alert('がんばる教科を えらんでね');return;}
 const hasBooks=(p.books||[]).length>0;
 if(hasBooks){for(const sj of d.subjects){const it=d.items.find(x=>x.subj===sj);
  if(!it||!it.text){alert('「'+sj+'」のテキストを えらんでね(ぜんぶ入力してから 作戦けってい!)');return;}
  if(!(Number(it.from)>=1&&Number(it.to)>=Number(it.from))){alert('「'+sj+'」のページばんごうを たしかめてね');return;}}}
 else if(!d.range.trim()){alert('「やるところ」を かいてね');return;}
 const wk=getWeek(p,key);
 wk.subjects=d.subjects.slice();
 wk.items=d.items.filter(x=>d.subjects.indexOf(x.subj)>=0);
 wk.range=d.range;
 let first=false;
 if(!wk.planTs){wk.planTs=Date.now();
  first=grantBonus(p,key,wk,'plan','📅作戦けってい ボーナス',false);}
 wk.planMt=Date.now();
 checkWeekLoop(p,key);save();render();
 if(first)alert('作戦けってい⚔️ パパ・ママが承認すると 🎁ボーナススロットが とどくよ!');}
let btDraft=null;
function btEnsure(p){const key=testTargetKey();
 if(btDraft&&btDraft.key===key&&btDraft.pid===S.currentProfile)return btDraft;
 const wk=p.weeks[key]||{};const t=wk.test||{};
 const items={};(t.items||[]).forEach(it=>{items[it.subj]={total:it.total,correct:it.correct};});
 btDraft={key,pid:S.currentProfile,subjects:(t.items||[]).map(it=>it.subj),items};

function btToggle(sj){const d=btDraft;if(!d)return;
 const i=d.subjects.indexOf(sj);
 if(i>=0)d.subjects.splice(i,1);
 else{d.subjects.push(sj);if(!d.items[sj])d.items[sj]={total:'',correct:''};}

function btSet(sj,f,v){const d=btDraft;if(!d)return;
 if(!d.items[sj])d.items[sj]={};d.items[sj][f]=v;}
function battleSave(){const p=P();const d=btDraft;if(!d)return;const key=d.key;
 if(!d.subjects.length){alert('バトルした教科を えらんでね');return;}
 const items=[];
 for(const sj of d.subjects){const it=d.items[sj]||{};
  const t=Math.floor(Number(it.total)),c=Math.floor(Number(it.correct));
  if(!(t>=1)||!(c>=0)||c>t){alert('「'+sj+'」の問題のかず(1いじょう)と せいかい(0〜問題のかず)を たしかめてね');return;}
  items.push({subj:sj,total:t,correct:c});}
 const wk=getWeek(p,key);
 const total=items.reduce((a,x)=>a+x.total,0);
 const correct=items.reduce((a,x)=>a+x.correct,0);
 const old=wk.reviews||[];
 wk.reviews=items.filter(x=>x.correct<x.total).map(x=>{
  const prev=old.find(r=>r.text===x.subj);return{text:x.subj,done:prev?prev.done:false};});
 if(!wk.test)wk.test={};
 wk.test.total=total;wk.test.correct=correct;wk.test.items=items;
 if(!wk.test.ts)wk.test.ts=Date.now();
 wk.testMt=Date.now();
 let got=grantBonus(p,key,wk,'test','⚔️ボスバトル ボーナス',false);
 if(correct===total){if(grantBonus(p,key,wk,'perfect','💯まんてん!パーフェクトボーナス',true)){got=true;confetti();}}
 checkWeekLoop(p,key);save();closeModal();btDraft=null;render();
 if(got)alert('きろくしたよ⚔️ パパ・ママが承認すると 🎁スロットが とどくよ!');}
function revengeHTML(p){const items=[];
 Object.keys(p.weeks).sort().reverse().forEach(k=>{
  (p.weeks[k].reviews||[]).forEach((r,i)=>{
   if(!r.done||k===testTargetKey())items.push({k,i,r});});});
 if(!items.length)return '';
 return '<h2 style="margin-top:12px">🔁 リベンジリスト</h2>'+
 '<div class="muted">まちがえた教科に、リベンジテストで もういちど ちょうせん!できたらタップでチェック。ぜんぶクリアで🎁(承認でスロット+1)</div>'+
 items.slice(0,20).map(x=>'<div class="ticket-item" style="cursor:pointer" onclick="revToggle(\''+x.k+'\','+x.i+')">'+
  '<span style="font-size:17px">'+(x.r.done?'✅':'⬜')+'</span>'+
  '<span style="flex:1;'+(x.r.done?'text-decoration:line-through;color:var(--ink-soft)':'')+'">'+esc(x.r.text)+' のリベンジ</span>'+
  '<span class="muted" style="font-size:10px">'+weekRangeLabel(x.k)+'</span></div>').join('');}
function revToggle(k,i){const p=P();const wk=p.weeks[k];
 if(!wk||!wk.reviews||!wk.reviews[i])return;
 wk.reviews[i].done=!wk.reviews[i].done;
 if(wk.reviews.length&&wk.reviews.every(r=>r.done)){

 const pts=p.exams.map(e=>({d:e.date,v:e.scores?e.scores[subj]:null})).filter(x=>x.v!=null&&x.v!=='');

 const vals=pts.map(x=>Number(x.v)||0);

 let min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);

 if(min===max){min-=5;max+=5;}
 const padV=(max-min)*.18;min-=padV;max+=padV;
 const x=i=>pad+i*((W-pad*2)/Math.max(1,pts.length-1));
 const y=v=>H-pad-((v-min)/(max-min))*(H-pad*2-8);
 let svg='<svg width="'+W+'" height="'+H+'">';
 if(tgt!==null&&tgt>0){svg+='<line x1="'+pad+'" y1="'+y(tgt)+'" x2="'+(W-pad)+'" y2="'+y(tgt)+'" stroke="#FFC53D" stroke-width="2" stroke-dasharray="6 4"/>'+

 svg+='<polyline points="'+vals.map((v,i)=>x(i)+','+y(v)).join(' ')+'" fill="none" stroke="#3E8FD8" stroke-width="3" stroke-linejoin="round"/>';

 return svg+'</svg>';}

let recog=null,recOn=false;
function voiceSupported(){return ('SpeechRecognition' in window)||('webkitSpeechRecognition' in window);}
function toggleVoice(){const ta=$('#chat-in');const btn=$('#mic-btn');
 if(!ta||!btn)return;
 if(recOn){try{recog.stop();}catch(e){}return;}
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 try{recog=new SR();}catch(e){alert('この端末では音声入力がつかえないみたい…');return;}
 recog.lang='ja-JP';recog.interimResults=true;recog.continuous=true;recog.maxAlternatives=1;
 const base=ta.value?ta.value+' ':'';
 let fin=''; // 確定ぶんの積み上げ
 recog.onresult=e=>{let interim='';
  for(let i=e.resultIndex;i<e.results.length;i++){ // 新しい結果だけ処理(重複防止)
   const r=e.results[i];const t=(r[0]&&r[0].transcript)||'';
   if(r.isFinal){if(t&&!fin.endsWith(t))fin+=t;} // 同じ確定が2回きたら捨てる
   else interim=t;} // 未確定は「最新のみ」を表示(足し込まない)
  const el=$('#chat-in');if(el)el.value=base+fin+interim;};
 recog.onend=()=>{recOn=false;
  const b=$('#mic-btn');if(b){b.textContent='🎤';b.classList.remove('rec');}};
 recog.onerror=()=>{};
 try{recog.start();recOn=true;btn.textContent='⏹';btn.classList.add('rec');}
 catch(e){alert('マイクがつかえないみたい。ブラウザのマイクきょかを見てね');}}

async function sendChat(forceText){const p=P();const ta=$('#chat-in');
 if(recOn)try{recog.stop();}catch(e){}
 const t=(forceText!=null?forceText:(ta?ta.value.trim():''));
 const img=chatPhotoData;
 if(!t&&!img)return;
 if(!S.gemini.key){alert('パパ・ママモードでAPIキーを設定してもらってね');return;}
 p.chat.push({id:'cm'+Date.now()+Math.random().toString(36).slice(2,6),r:'user',t:t||'（この写真を見てね）',img:img||null,ts:Date.now()});
 chatPhotoData=null;save();render();scrollChat();
 const ty=$('#typing');if(ty)ty.textContent=p.aiName+' がかんがえ中…';
 try{
  const hist=p.chat.slice(-20).map(m=>{const parts=[{text:m.t}];
   if(m.img){parts.push({inline_data:{mime_type:'image/jpeg',data:m.img.split(',')[1]}});}
   return {role:m.r,parts};});
  const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+
   encodeURIComponent(S.gemini.model)+':generateContent?key='+encodeURIComponent(S.gemini.key),{
   method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({systemInstruction:{parts:[{text:sysPrompt(p)}]},contents:hist,
    generationConfig:{maxOutputTokens:4096}})});
  const data=await res.json();
  let txt;
  if(data.error){txt='エラーみたい:'+(data.error.message||'')+'\nパパにカギ(APIキー)やモデル名を見てもらってね。';}
  else{txt=(data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts||[])
   .map(x=>x.text||'').join('')||'(うまく へんじできなかった…もういちど ためしてね)';}
  p.chat.push({id:'cm'+Date.now()+Math.random().toString(36).slice(2,6),r:'model',t:txt,ts:Date.now()});
 }catch(e){p.chat.push({id:'cm'+Date.now()+Math.random().toString(36).slice(2,6),r:'model',t:'つうしんエラーだよ。でんぱのあるところで もういちど ためしてね📡',ts:Date.now()});}

/* ---------- 🔀マージ基盤(A-5) ----------
   mergeState(a,b): a,bを破壊しない純関数。同期対象フィールドは可換(a,b入替で同結果)。
   端末ローカル項目(gemini/tab/currentProfile/activeSession)は a(呼び出し側)の値を維持する */
function unionDead(x,y){const o={};[x||{},y||{}].forEach(d=>Object.entries(d).forEach(([k,v])=>{if(!o[k]||v>o[k])o[k]=v;}));return o;}
function pickDet(a,b){ // 同ID・同mtで内容が違うとき、引数順に依らず同じ方を選ぶ(JSON辞書順の大きい方)
 return JSON.stringify(a)>=JSON.stringify(b)?a:b;}
function unionById(x,y){const map={};const order=[];
 (x||[]).concat(y||[]).forEach(e=>{if(!e||e.id==null)return;
  const cur=map[e.id];
  if(!cur){map[e.id]=e;order.push(e.id);}
  else map[e.id]=pickDet(cur,e);}); // 同IDは1件に収束(例:同一セッションを2端末でスピン)
 return order.map(id=>map[id]);}
function mergeById(x,y,dead){ // 和集合+同IDはmt(更新時刻)が新しい方。墓標は除外
 const map={};const order=[];
 (x||[]).concat(y||[]).forEach(e=>{if(!e||e.id==null)return;
  if(dead&&dead[e.id])return;
  const cur=map[e.id];
  if(!cur){map[e.id]=e;order.push(e.id);}
  else if((e.mt||0)>(cur.mt||0))map[e.id]=e;
  else if((e.mt||0)===(cur.mt||0))map[e.id]=pickDet(cur,e);});
 return order.map(id=>map[id]);}
function mergeWeeks(wa,wb){const out={};
 new Set([...Object.keys(wa||{}),...Object.keys(wb||{})]).forEach(k=>{
  const x=(wa||{})[k],y=(wb||{})[k];
  if(!x||!y){out[k]=JSON.parse(JSON.stringify(x||y));return;}
  const w={};
  /* planブロック: planMt LWW(同値なら planTs で決着=旧データも決定的に) */
  const px=(x.planMt||0)>(y.planMt||0)?x:(y.planMt||0)>(x.planMt||0)?y:((x.planTs||0)>=(y.planTs||0)?x:y);
  w.subjects=(px.subjects||[]).slice();w.items=JSON.parse(JSON.stringify(px.items||[]));
  w.range=px.range||'';w.goal=px.goal||'';w.planTs=px.planTs||null;
  w.planMt=Math.max(x.planMt||0,y.planMt||0);
  /* testブロック(reviewsの構成含む): testMt LWW */
  const tx=(x.testMt||0)>(y.testMt||0)?x:(y.testMt||0)>(x.testMt||0)?y:(((x.test&&x.test.ts)||0)>=((y.test&&y.test.ts)||0)?x:y);
  w.test=tx.test?JSON.parse(JSON.stringify(tx.test)):null;
  w.reviews=JSON.parse(JSON.stringify(tx.reviews||[]));
  w.testMt=Math.max(x.testMt||0,y.testMt||0);
  /* reviewsのdoneは教科名でつき合わせOR(trueが勝ち) */
  const dn={};[x,y].forEach(s=>(s.reviews||[]).forEach(r=>{if(r.done)dn[r.text]=1;}));
  w.reviews.forEach(r=>{if(dn[r.text])r.done=true;});
  /* granted: キー単位OR(ボーナス実体は決定的IDで重複しない) */
  w.granted=Object.assign({},x.granted||{},y.granted||{});
  /* report: tsが新しい方 */
  const rx=x.report,ry=y.report;
  w.report=(!rx)?(ry?JSON.parse(JSON.stringify(ry)):undefined):(!ry)?JSON.parse(JSON.stringify(rx)):
   JSON.parse(JSON.stringify(((rx.ts||0)>=(ry.ts||0))?rx:ry));
  if(w.report===undefined)delete w.report;
  out[k]=w;});
 return out;}

function metaSrc(id,pa,pb){ /* スカラー群の採用元: metaMt LWW。同点(旧データ移行直後や未編集は0同士)は

   可換性が壊れ、2端末が互いに送り返し続けるpush無限ループになる */

function mergeProfile(pa,pb,id){
 const dead=unionDead(pa.deleted,pb.deleted);
 const p=JSON.parse(JSON.stringify(metaSrc(id,pa,pb))); // スカラー群(name/em/grade/pin/aiName/examTarget/bigGoals/pool/books/theme)はmetaMt LWWで丸ごと
 const A=JSON.parse(JSON.stringify(pa)),B=JSON.parse(JSON.stringify(pb));
 p.metaMt=Math.max(pa.metaMt||0,pb.metaMt||0);
 p.deleted=dead;
 p.ownedThemes=[...new Set([...(A.ownedThemes||[]),...(B.ownedThemes||[])])]; // 例外: 購入を失わない和集合
 const byId=(x,y)=>x.id>y.id?1:x.id<y.id?-1:0; // 同時刻はIDで決着(順序を引数順に依存させない)

function mergeState(a,b){

 /* きち: basesMtが新しい方の配列+墓標適用。同点はデフォルトのままの側が負け→内容の辞書順(可換) */
 const _ba=m.basesMt||0,_bb=B.basesMt||0;let _bs;
 if(_ba>_bb)_bs=m.bases; else if(_bb>_ba)_bs=B.bases;
 else{const D=stableStr(DEFAULT_BASES),sa=stableStr(m.bases),sb=stableStr(B.bases);
  _bs=(sa===D&&sb!==D)?B.bases:(sb===D&&sa!==D)?m.bases:(sa>=sb?m.bases:B.bases);}
 m.bases=_bs.filter(b2=>!m.deleted['base-'+b2.id]);
 m.basesMt=Math.max(m.basesMt||0,B.basesMt||0);
 /* 親PIN: pinMtが新しい方。同点は未設定(null)が負け→辞書順(可換) */
 const _pma=m.pinMt||0,_pmb=B.pinMt||0;
 if(_pmb>_pma)m.parentPin=B.parentPin;
 else if(_pmb===_pma&&(m.parentPin||'')!==(B.parentPin||''))
  m.parentPin=(m.parentPin==null)?B.parentPin:(B.parentPin==null)?m.parentPin:
   ((m.parentPin>=B.parentPin)?m.parentPin:B.parentPin);
 m.pinMt=Math.max(m.pinMt||0,B.pinMt||0);
 /* 📅リマインダー設定: planRemindMtが新しい方。同点は既定値のままの側が負け→辞書順(可換) */
 const _ra=m.planRemindMt||0,_rb=B.planRemindMt||0;
 if(_rb>_ra)m.planRemind=B.planRemind;
 else if(_rb===_ra){const D=stableStr(DEFAULT_STATE.planRemind),sa=stableStr(m.planRemind),sb=stableStr(B.planRemind);
  if(sa!==sb)m.planRemind=(sa===D&&sb!==D)?B.planRemind:(sb===D&&sa!==D)?m.planRemind:(sa>=sb?m.planRemind:B.planRemind);}
 m.planRemindMt=Math.max(_ra,_rb);
 /* profiles: IDの和集合+墓標。両方に居ればフィールド毎マージ */
 m.profiles=m.profiles||{};
 new Set([...Object.keys(m.profiles),...Object.keys(B.profiles||{})]).forEach(id=>{
  if(m.deleted['pf-'+id]){delete m.profiles[id];return;}
  const pa=m.profiles[id],pb=(B.profiles||{})[id];
  if(!pa&&pb){m.profiles[id]=pb;return;}
  if(pa&&pb)m.profiles[id]=mergeProfile(pa,pb,id);});

 /* gemini/tab/currentProfile/activeSession はローカル維持(mはaのコピーなのでそのまま) */
 return m;}

function firebaseTransport(){

   ref=firebase.database().ref('families/'+code);

  stop(){if(ref&&cb)ref.off('value',cb);ref=null;cb=null;},
  push(fn){if(!ref)return Promise.reject(new Error('not connected'));

function applyMerge(){if(!pendingMerge)return;
 S=pendingMerge;pendingMerge=null;
 save();closeModal();render();
 alert('合体しました🔀 ポイントは通帳(台帳)の合計に再計算されています');}
/* ---------- ⭐親の手動ポイント調整(A-4) ---------- */
function adjustPoints(){const p=P();
 const d=Math.round(Number($('#adj-delta').value));
 if(!d){alert('プラスかマイナスの数字を入れてください(例: 50 / -30)');return;}
 const memo=$('#adj-memo').value.trim();
 addLedger(p,d,'adjust',memo||null);
 save();openParent();}

/* ☁️かぞく同期: 設定済みかつコード保存済みなら自動接続。オンライン復帰で保留分を再送 */
